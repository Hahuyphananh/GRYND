name: disk maintenance

# Manual only. The release host filled up, so every deploy fails while rsyncing
# the tooling ("No space left on device"). This job reports disk use, runs the
# release tool's own prune (which never deletes the active or previous release)
# and clears only uninstalled uploads from incoming/. It never touches the live
# release, the env files or the state pointers.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report disk use (no prune, no incoming cleanup)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  disk:
    name: report and prune the release host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'grynd-deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      REMOTE_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/grynd' }}
      SSH_CMD: /home/runner/.ssh/deploy-ssh
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Install the dedicated key and pinned host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$SSH_CMD" <<'SSH_WRAPPER'
          #!/bin/bash
          exec ssh -i "$HOME/.ssh/id_deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$@"
          SSH_WRAPPER
          chmod 700 "$SSH_CMD"

      - name: Report disk use before
        shell: bash
        run: |
          set -euo pipefail
          "$SSH_CMD" "$DEPLOY_USER@$DEPLOY_HOST" \
            "df -h / /home 2>/dev/null; echo '--- releases'; du -sh '$REMOTE_PATH'/* 2>/dev/null | sort -h | tail -12"

      - name: Prune old releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: skipping prune"
            exit 0
          fi
          "$SSH_CMD" "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ -f '$REMOTE_PATH/tool/release.mjs' ]; then cd '$REMOTE_PATH' && node tool/release.mjs prune --keep=3 --json; else echo 'release tool missing; skipped prune'; fi"

      - name: Clear uninstalled uploads
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: skipping incoming cleanup"
            exit 0
          fi
          # incoming/ holds uploads that were never installed; the live release
          # lives under releases/ and is untouched.
          "$SSH_CMD" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$REMOTE_PATH/incoming'; find '$REMOTE_PATH/incoming' -mindepth 1 -maxdepth 1 -exec rm -rf {} + ; echo 'incoming cleared'"

      - name: Report disk use after
        shell: bash
        run: |
          set -euo pipefail
          "$SSH_CMD" "$DEPLOY_USER@$DEPLOY_HOST" \
            "df -h / /home 2>/dev/null; echo '--- releases'; du -sh '$REMOTE_PATH'/* 2>/dev/null | sort -h | tail -12"
