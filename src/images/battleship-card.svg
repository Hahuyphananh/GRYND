<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="battleship-title">
  <title id="battleship-title">Battleship — geometric block illustration</title>
  <rect width="1200" height="630" fill="#030817"/>
  <g stroke="#12274d" stroke-width="2">
    <rect x="0" y="0" width="1200" height="630" fill="none"/>
  </g>

  <!-- left board: the player's fleet -->
  <g transform="translate(90 120)">
    <g fill="#081530" stroke="#14315c">
      <rect x="0" y="0" width="420" height="420" rx="14" fill="#061229" stroke="#14315c"/>
    </g>
    <g fill="#0a1a3d" stroke="#153a72">
      <rect x="22" y="22" width="34" height="34" rx="4"/>
      <rect x="64" y="22" width="34" height="34" rx="4"/>
      <rect x="106" y="22" width="34" height="34" rx="4"/>
      <rect x="148" y="22" width="34" height="34" rx="4"/>
      <rect x="190" y="22" width="34" height="34" rx="4"/>
      <rect x="22" y="64" width="34" height="34" rx="4"/>
      <rect x="64" y="64" width="34" height="34" rx="4"/>
      <rect x="106" y="64" width="34" height="34" rx="4"/>
      <rect x="22" y="106" width="34" height="34" rx="4"/>
      <rect x="64" y="106" width="34" height="34" rx="4"/>
      <rect x="106" y="106" width="34" height="34" rx="4"/>
      <rect x="22" y="148" width="34" height="34" rx="4"/>
      <rect x="64" y="148" width="34" height="34" rx="4"/>
      <rect x="22" y="190" width="34" height="34" rx="4"/>
    </g>
    <!-- ships, as blocks -->
    <g fill="#2f6bff" stroke="#8ab4ff" stroke-width="2">
      <rect x="22" y="22" width="202" height="34" rx="6" opacity="0.95"/>
      <rect x="22" y="64" width="160" height="34" rx="6" opacity="0.9"/>
      <rect x="22" y="106" width="118" height="34" rx="6" opacity="0.85"/>
      <rect x="22" y="148" width="76" height="34" rx="6" opacity="0.8"/>
    </g>
    <rect x="22" y="190" width="76" height="34" rx="6" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
  </g>

  <!-- right board: enemy waters, only shots revealed -->
  <g transform="translate(690 120)">
    <rect x="0" y="0" width="420" height="420" rx="14" fill="#061229" stroke="#14315c"/>
    <g fill="#0a1a3d" stroke="#153a72">
      <rect x="22" y="22" width="34" height="34" rx="4"/>
      <rect x="64" y="22" width="34" height="34" rx="4"/>
      <rect x="106" y="22" width="34" height="34" rx="4"/>
      <rect x="148" y="22" width="34" height="34" rx="4"/>
      <rect x="190" y="22" width="34" height="34" rx="4"/>
      <rect x="232" y="22" width="34" height="34" rx="4"/>
      <rect x="274" y="22" width="34" height="34" rx="4"/>
      <rect x="22" y="64" width="34" height="34" rx="4"/>
      <rect x="64" y="64" width="34" height="34" rx="4"/>
      <rect x="106" y="64" width="34" height="34" rx="4"/>
      <rect x="148" y="64" width="34" height="34" rx="4"/>
      <rect x="190" y="64" width="34" height="34" rx="4"/>
      <rect x="232" y="64" width="34" height="34" rx="4"/>
      <rect x="22" y="106" width="34" height="34" rx="4"/>
      <rect x="64" y="106" width="34" height="34" rx="4"/>
      <rect x="106" y="106" width="34" height="34" rx="4"/>
      <rect x="148" y="106" width="34" height="34" rx="4"/>
      <rect x="190" y="106" width="34" height="34" rx="4"/>
      <rect x="22" y="148" width="34" height="34" rx="4"/>
      <rect x="64" y="148" width="34" height="34" rx="4"/>
      <rect x="106" y="148" width="34" height="34" rx="4"/>
      <rect x="148" y="148" width="34" height="34" rx="4"/>
      <rect x="190" y="148" width="34" height="34" rx="4"/>
      <rect x="22" y="190" width="34" height="34" rx="4"/>
      <rect x="64" y="190" width="34" height="34" rx="4"/>
      <rect x="106" y="190" width="34" height="34" rx="4"/>
    </g>
    <!-- revealed results only: one hit, two misses, plus the selected target -->
    <rect x="148" y="64" width="34" height="34" rx="4" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
    <rect x="106" y="148" width="34" height="34" rx="4" fill="#ffffff"/>
    <rect x="190" y="190" width="34" height="34" rx="4" fill="#ffffff"/>
    <rect x="232" y="106" width="34" height="34" rx="4" fill="none" stroke="#ffec08" stroke-width="4"/>
  </g>

  <!-- accent + wordmark -->
  <g transform="translate(90 560)">
    <rect x="0" y="0" width="120" height="10" rx="5" fill="#ffec08"/>
    <text x="140" y="12" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" letter-spacing="10">BATTLESHIP</text>
  </g>
  <g transform="translate(690 560)">
    <text x="0" y="12" fill="#ffec08" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="6">GRYND</text>
  </g>
</svg>
