<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Blackjack — Ace of Spades and King of Hearts face-up on a neon hex-grid backdrop with a digital score readout">
  <title>Blackjack</title>
  <defs>
    <!-- Tight glow. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for chip / readout. -->
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Hot magenta glow. -->
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Casino-night backdrop. -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#261c5b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <!-- Hex-grid pattern (subtle). -->
    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse">
      <polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.25"/>
    </pattern>

    <!-- Holographic card face (white with magenta-cyan edge gradient). -->
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f3f7"/>
      <stop offset="100%" stop-color="#e0e7f5"/>
    </linearGradient>
    <!-- Holographic card edge (magenta-cyan-gold). -->
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <!-- Card back (cyber circuit pattern). -->
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Backdrop + hex grid + holographic scanlines. -->
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#hexGrid)"/>
  <ellipse cx="240" cy="290" rx="220" ry="190" fill="#5b21b6" opacity="0.18"/>

  <!-- Holographic horizontal scanlines. -->
  <g opacity="0.09" fill="none" stroke="#00e5ff" stroke-width="0.5">
    <line x1="0" y1="40"  x2="480" y2="40"/>
    <line x1="0" y1="100" x2="480" y2="100"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="220" x2="480" y2="220"/>
    <line x1="0" y1="280" x2="480" y2="280"/>
    <line x1="0" y1="340" x2="480" y2="340"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="0" y1="460" x2="480" y2="460"/>
  </g>

  <!-- Edge sparkles (cyberpunk neon). -->
  <g fill="#ffffff">
    <circle cx="40"  cy="80"  r="2"   opacity="0.9"/>
    <circle cx="440" cy="100" r="2.5" opacity="0.9"/>
    <circle cx="50"  cy="430" r="2"   opacity="0.9"/>
    <circle cx="430" cy="420" r="3"   opacity="0.9"/>
    <circle cx="240" cy="20"  r="1.5" opacity="0.7"/>
    <circle cx="55"  cy="240" r="2"   fill="#00e5ff" opacity="0.95"/>
    <circle cx="425" cy="240" r="2"   fill="#ff4fd8" opacity="0.95"/>
  </g>

  <!-- Top digital readout: cyberpunk LED-style. -->
  <g transform="translate(240 56)">
    <rect x="-100" y="-22" width="200" height="40" rx="3" fill="#000816" stroke="#00e5ff" stroke-width="2" filter="url(#bigGlow)"/>
    <rect x="-94"  y="-16" width="188" height="28" rx="2" fill="none" stroke="#ff4fd8" stroke-width="0.6" opacity="0.7"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="22" font-weight="900" fill="#67e8f9" text-anchor="middle" letter-spacing="5">0x15  21</text>
  </g>

  <!-- Neon circuit-trace ornaments at the corners. -->
  <g stroke="#ff4fd8" stroke-width="1.4" fill="none" stroke-linecap="round" filter="url(#hotGlow)">
    <polyline points="40,140 70,160 90,160 100,175"/>
    <polyline points="40,220 60,220 80,230"/>
    <polyline points="440,140 410,160 390,160 380,175"/>
    <polyline points="440,220 420,220 400,230"/>
    <circle cx="40"  cy="140" r="2.5" fill="#ff4fd8"/>
    <circle cx="40"  cy="220" r="2"   fill="#00e5ff"/>
    <circle cx="440" cy="140" r="2.5" fill="#ff4fd8"/>
    <circle cx="440" cy="220" r="2"   fill="#00e5ff"/>
  </g>

  <!-- Card-back stack (slightly visible behind front cards) — feels like a deck pile. -->
  <g filter="url(#neonGlow)">
    <g transform="translate(245 360) rotate(-3)">
      <rect x="-58" y="-86" width="116" height="172" rx="7" fill="url(#cardBack)" stroke="#00e5ff" stroke-width="2"/>
      <rect x="-50" y="-78" width="100" height="156" rx="4" fill="none" stroke="#ff4fd8" stroke-width="1" opacity="0.85" stroke-dasharray="6 4"/>
      <g transform="scale(1.4)" fill="#00e5ff">
        <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
      </g>
    </g>
  </g>

  <!-- Card 1: Ace of Spades (centered at 200,270, tilted -10°, holographic edge). -->
  <g transform="translate(200 270) rotate(-10)" filter="url(#neonGlow)">
    <!-- Holographic edge stroke (outer rim) -->
    <rect x="-55" y="-82" width="110" height="164" rx="6" fill="none" stroke="url(#cardEdge)" stroke-width="3"/>
    <!-- Card body. -->
    <rect x="-52" y="-79" width="104" height="158" rx="5" fill="url(#cardFace)" stroke="#1f2937" stroke-width="0.8"/>
    <!-- Inner border. -->
    <rect x="-46" y="-73" width="92" height="146" rx="4" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Top-left corner: "A" + spade. -->
    <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#0f172a" text-anchor="start">A</text>
    <g transform="translate(-26 -52) scale(0.6)" fill="#0f172a">
      <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
    </g>
    <!-- Bottom-right corner rotated copy. -->
    <g transform="rotate(180)">
      <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#0f172a" text-anchor="start">A</text>
      <g transform="translate(-26 -52) scale(0.6)" fill="#0f172a">
        <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
      </g>
    </g>
    <!-- Big center spade pip. -->
    <g transform="scale(3.4)" fill="#0f172a">
      <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
    </g>
  </g>

  <!-- Card 2: King of Hearts (centered at 280,270, tilted +10°, holographic edge). -->
  <g transform="translate(280 270) rotate(10)" filter="url(#neonGlow)">
    <rect x="-55" y="-82" width="110" height="164" rx="6" fill="none" stroke="url(#cardEdge)" stroke-width="3"/>
    <rect x="-52" y="-79" width="104" height="158" rx="5" fill="url(#cardFace)" stroke="#1f2937" stroke-width="0.8"/>
    <rect x="-46" y="-73" width="92" height="146" rx="4" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Top-left "K" + heart. -->
    <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#dc2626" text-anchor="start">K</text>
    <g transform="translate(-22 -52) scale(0.6)" fill="#dc2626">
      <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
    </g>
    <!-- Bottom-right rotated copy. -->
    <g transform="rotate(180)">
      <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#dc2626" text-anchor="start">K</text>
      <g transform="translate(-22 -52) scale(0.6)" fill="#dc2626">
        <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
      </g>
    </g>
    <!-- Center: large "K" + heart pip. -->
    <text x="0" y="-8" font-family="serif, Georgia, 'Times New Roman'" font-size="48" font-weight="900" fill="#dc2626" text-anchor="middle">K</text>
    <g transform="translate(0 38) scale(2.2)" fill="#dc2626">
      <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
    </g>
  </g>

  <!-- Floating "21" cyber chip bottom-right. -->
  <g transform="translate(395 410)" filter="url(#bigGlow)">
    <circle cx="0" cy="0" r="30" fill="#ff4fd8" stroke="#00e5ff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fcd34d" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="0" y="7" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">21</text>
  </g>
</svg>
