<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Blackjack — Ace of Spades and King of Hearts face-up, vertically centered">
  <title>Blackjack</title>
  <defs>
    <!-- Tight glow for card edges. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Holographic card face (white with magenta-cyan edge gradient). -->
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f3f7"/>
      <stop offset="100%" stop-color="#e0e7f5"/>
    </linearGradient>
    <!-- Holographic card edge (magenta-cyan-gold). -->
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- Card 1: Ace of Spades (centered at 200,240, tilted -10°, holographic edge). -->
  <g transform="translate(200 240) rotate(-10)" filter="url(#neonGlow)">
    <rect x="-55" y="-82" width="110" height="164" rx="6" fill="none" stroke="url(#cardEdge)" stroke-width="3"/>
    <rect x="-52" y="-79" width="104" height="158" rx="5" fill="url(#cardFace)" stroke="#1f2937" stroke-width="0.8"/>
    <rect x="-46" y="-73" width="92" height="146" rx="4" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Top-left corner: "A" + spade. -->
    <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#0f172a" text-anchor="start">A</text>
    <g transform="translate(-26 -52) scale(0.6)" fill="#0f172a">
      <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
    </g>
    <!-- Bottom-right corner rotated copy. -->
    <g transform="rotate(180)">
      <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#0f172a" text-anchor="start">A</text>
      <g transform="translate(-26 -52) scale(0.6)" fill="#0f172a">
        <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
      </g>
    </g>
    <!-- Big center spade pip. -->
    <g transform="scale(3.4)" fill="#0f172a">
      <path d="M 0,-15 C -12,-5 -12,8 0,12 C 12,8 12,-5 0,-15 Z M -3,12 L 3,12 L 0,20 Z"/>
    </g>
  </g>

  <!-- Card 2: King of Hearts (centered at 280,240, tilted +10°, holographic edge). -->
  <g transform="translate(280 240) rotate(10)" filter="url(#neonGlow)">
    <rect x="-55" y="-82" width="110" height="164" rx="6" fill="none" stroke="url(#cardEdge)" stroke-width="3"/>
    <rect x="-52" y="-79" width="104" height="158" rx="5" fill="url(#cardFace)" stroke="#1f2937" stroke-width="0.8"/>
    <rect x="-46" y="-73" width="92" height="146" rx="4" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Top-left "K" + heart. -->
    <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#dc2626" text-anchor="start">K</text>
    <g transform="translate(-22 -52) scale(0.6)" fill="#dc2626">
      <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
    </g>
    <g transform="rotate(180)">
      <text x="-44" y="-58" font-family="serif, Georgia, 'Times New Roman'" font-size="22" font-weight="900" fill="#dc2626" text-anchor="start">K</text>
      <g transform="translate(-22 -52) scale(0.6)" fill="#dc2626">
        <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
      </g>
    </g>
    <!-- Center: large "K" + heart pip. -->
    <text x="0" y="-8" font-family="serif, Georgia, 'Times New Roman'" font-size="48" font-weight="900" fill="#dc2626" text-anchor="middle">K</text>
    <g transform="translate(0 38) scale(2.2)" fill="#dc2626">
      <path d="M 0,15 C -12,5 -15,-8 -8,-10 C -3,-11 -1,-7 0,-5 C 1,-7 3,-11 8,-10 C 15,-8 12,5 0,15 Z"/>
    </g>
  </g>
</svg>
