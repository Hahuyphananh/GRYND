<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Chess — gold king on an 8x8 checkerboard">
  <title>Chess</title>
  <defs>
    <!-- Tight glow for body. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for the crown / cross. -->
    <filter id="crownGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Classic wood-tone light square gradient. -->
    <linearGradient id="lightSquare" x1="0" y1="0%" x2="0" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d6a85a"/>
    </linearGradient>
    <!-- Classic wood-tone dark square gradient. -->
    <linearGradient id="darkSquare" x1="0" y1="0%" x2="0" y2="100%">
      <stop offset="0%" stop-color="#7a4f08"/>
      <stop offset="100%" stop-color="#3a2506"/>
    </linearGradient>

    <!-- Gold king fill — vertical falloff with a top-light emphasis. -->
    <linearGradient id="kingGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaa8"/>
      <stop offset="40%" stop-color="#f5c842"/>
      <stop offset="80%" stop-color="#c08800"/>
      <stop offset="100%" stop-color="#7a4f08"/>
    </linearGradient>

    <!-- Bulb-specific deeper gold to make the bulb read as a different element. -->
    <radialGradient id="bulbGold" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fffae8"/>
      <stop offset="55%" stop-color="#f7d54a"/>
      <stop offset="100%" stop-color="#8d6210"/>
    </radialGradient>

    <!-- Checkerboard pattern: 8x8 grid, 48x48 per cell, total 384x384 centered at (240,240). -->
    <pattern id="checker" x="48" y="48" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="url(#lightSquare)"/>
      <rect x="48" y="0" width="48" height="48" fill="url(#darkSquare)"/>
      <rect y="48" x="0" width="48" height="48" fill="url(#darkSquare)"/>
      <rect x="48" y="48" width="48" height="48" fill="url(#lightSquare)"/>
    </pattern>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- Board frame (outer slate). -->
  <g filter="url(#neonGlow)">
    <rect x="40" y="40" width="400" height="400" rx="6" fill="#0a1428" stroke="#fcd34d" stroke-width="2"/>
  </g>

  <!-- 8x8 checkerboard surface (384x384, starting at (48,48)). -->
  <rect x="48" y="48" width="384" height="384" fill="url(#checker)"/>

  <!-- Subtle grid lines between squares. -->
  <g stroke="#0a1428" stroke-width="0.5" opacity="0.45">
    <line x1="48"  y1="48"  x2="432" y2="48"/>
    <line x1="48"  y1="96"  x2="432" y2="96"/>
    <line x1="48"  y1="144" x2="432" y2="144"/>
    <line x1="48"  y1="192" x2="432" y2="192"/>
    <line x1="48"  y1="240" x2="432" y2="240"/>
    <line x1="48"  y1="288" x2="432" y2="288"/>
    <line x1="48"  y1="336" x2="432" y2="336"/>
    <line x1="48"  y1="384" x2="432" y2="384"/>
    <line x1="432" y1="48"  x2="432" y2="432"/>
    <line x1="48"  y1="432" x2="432" y2="432"/>
    <line x1="48"  y1="48"  x2="48"  y2="432"/>
  </g>

  <!-- Highlighted square under the king — bottom-middle dark square. -->
  <g opacity="0.55">
    <rect x="240" y="288" width="48" height="48" fill="#00e5ff"/>
  </g>

  <!-- 3-tier base molding (gold king centered at (240, 240), contained within board 48..432). -->
  <g filter="url(#neonGlow)">
    <rect x="180" y="380" width="120" height="20" rx="4" fill="url(#kingGold)" stroke="#5a4010" stroke-width="2.5"/>
    <rect x="190" y="355" width="100" height="25" rx="5" fill="url(#kingGold)" stroke="#5a4010" stroke-width="2.5"/>
    <rect x="210" y="330" width="60" height="25" rx="4" fill="url(#kingGold)" stroke="#5a4010" stroke-width="2.5"/>

    <rect x="188" y="383" width="104" height="3" rx="1.5" fill="#fff5cc" opacity="0.65"/>
    <rect x="198" y="358" width="84"  height="3" rx="1.5" fill="#fff5cc" opacity="0.65"/>
    <rect x="218" y="333" width="44"  height="3" rx="1.5" fill="#fff5cc" opacity="0.65"/>
  </g>

  <!-- Body column — tapered silhouette rising into the crown collar. -->
  <g filter="url(#neonGlow)">
    <path d="M 215,330 Q 215,275 227,245 Q 233,228 240,228 Q 247,228 253,245 Q 265,275 265,330 Z"
          fill="url(#kingGold)" stroke="#5a4010" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <!-- Center highlight stripe on the body for top-light shading. -->
  <path d="M 235,330 Q 235,288 237,265 L 240,255 L 240,330 L 235,330 Z" fill="#fff5cc" opacity="0.4"/>

  <!-- Decorative rivet ring around the middle of the stem. -->
  <g filter="url(#neonGlow)">
    <ellipse cx="240" cy="290" rx="28" ry="2.5" fill="url(#kingGold)" stroke="#5a4010" stroke-width="1.6"/>
  </g>

  <!-- Crown collar — wider, where the bulb sits. -->
  <g filter="url(#neonGlow)">
    <ellipse cx="240" cy="218" rx="32" ry="9" fill="url(#kingGold)" stroke="#5a4010" stroke-width="2.5"/>
    <rect x="212" y="212" width="56" height="2" rx="1" fill="#fff5cc" opacity="0.6"/>
  </g>

  <!-- Bulb — egg-shaped (slightly taller than wide) with a thin pearl-stud band. -->
  <g filter="url(#neonGlow)">
    <ellipse cx="240" cy="188" rx="20" ry="22" fill="url(#bulbGold)" stroke="#5a4010" stroke-width="2.5"/>
    <ellipse cx="240" cy="188" rx="20" ry="3.4" fill="none" stroke="#5a4010" stroke-width="0.9" opacity="0.6"/>
    <ellipse cx="240" cy="174" rx="14" ry="2.5" fill="#5a4010" opacity="0.45"/>
  </g>

  <!-- Cross pattée — flared arms, embedded in the bulb top. -->
  <g filter="url(#crownGlow)">
    <path d="M 234,140
             L 246,140
             L 246,150
             L 264,156
             L 264,172
             L 246,178
             L 246,188
             L 234,188
             L 234,178
             L 216,172
             L 216,156
             L 234,150 Z"
          fill="url(#bulbGold)" stroke="#5a4010" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="240" cy="164" r="2.8" fill="#5a4010" opacity="0.7"/>
  </g>

  <!-- Bulb specular highlight (drawn last on top of everything). -->
  <ellipse cx="232" cy="172" rx="5" ry="2.4" fill="#fffae8" opacity="0.75"/>
</svg>
