<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Clicker — neon click button centered with mouse cursor clicking on it, ripple rings and digital readouts around it">
  <title>Clicker</title>
  <defs>
    <!-- Filters for the neon glows. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Casino-night backdrop. -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#261c5b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <!-- Hex-grid pattern. -->
    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse">
      <polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.22"/>
    </pattern>

    <!-- Button gradient: magenta-pink. -->
    <radialGradient id="btnGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="55%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#5a0a76"/>
    </radialGradient>

    <!-- Cursor gradient: white to slate. -->
    <linearGradient id="cursorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cursor drop shadow. -->
    <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Backdrop + hex grid + violet vignette. -->
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#hexGrid)"/>
  <ellipse cx="240" cy="240" rx="220" ry="200" fill="#5b21b6" opacity="0.18"/>

  <!-- Edge sparkles (cyberpunk neon). -->
  <g fill="#ffffff">
    <circle cx="40"  cy="80"  r="2"   opacity="0.9"/>
    <circle cx="440" cy="100" r="2.5" opacity="0.9"/>
    <circle cx="50"  cy="430" r="2"   opacity="0.9"/>
    <circle cx="430" cy="420" r="3"   opacity="0.9"/>
    <circle cx="240" cy="20"  r="1.5" opacity="0.7"/>
    <circle cx="55"  cy="240" r="2"   fill="#00e5ff" opacity="0.95"/>
    <circle cx="425" cy="240" r="2"   fill="#ff4fd8" opacity="0.95"/>
  </g>

  <!-- Concentric ripple rings around the (centered) button. -->
  <g transform="translate(240 240)" fill="none">
    <circle r="190" stroke="#fcd34d" stroke-width="1" opacity="0.5" filter="url(#hotGlow)"/>
    <circle r="155" stroke="#ff4fd8" stroke-width="1" opacity="0.7" filter="url(#hotGlow)"/>
    <circle r="125" stroke="#67e8f9" stroke-width="1.2" opacity="0.85" filter="url(#hotGlow)"/>
    <circle r="100" stroke="#fcd34d" stroke-width="1" opacity="0.5" filter="url(#hotGlow)"/>
  </g>

  <!-- Big button, centered at (240, 240). -->
  <g transform="translate(240 240)" filter="url(#bigGlow)">
    <circle r="78" fill="url(#btnGrad)" stroke="#00e5ff" stroke-width="3"/>
  </g>

  <!--
       Click ripple emanating from the (future) cursor tip / button center.
       Drawn BEFORE the cursor so the ripple sits behind the cursor silhouette.
  -->
  <g transform="translate(240 240)" fill="none" filter="url(#hotGlow)">
    <circle r="20" stroke="#00e5ff" stroke-width="1.6" opacity="0.9"/>
    <circle r="34" stroke="#ff4fd8" stroke-width="1.1" opacity="0.55"/>
    <circle r="48" stroke="#fcd34d" stroke-width="0.7" opacity="0.35"/>
  </g>

  <!--
       Mouse cursor CENTERED on the button — tip at (240, 240), body fans down-right.
       Drawn AFTER the click ripple so the cursor sits cleanly on top of the expanding rings.
  -->
  <g transform="translate(240 240)" filter="url(#cursorShadow)">
    <path d="M 0,0 L 0,22 L 6,16 L 11,24 L 14,22 L 9,14 L 18,14 Z"
          fill="url(#cursorFill)" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
