<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Coin Flip — neon coin mid-flip with the GoonBet monogram on the face">
  <title>Coin Flip</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="coinFace" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfd8e3"/>
      <stop offset="80%" stop-color="#5a6b80"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </radialGradient>

    <linearGradient id="coinRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ff4fd8"/>
      <stop offset="50%"  stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>

    <radialGradient id="gFace" cx="40%" cy="35%" r="80%">
      <stop offset="0%"  stop-color="#0eaa58"/>
      <stop offset="55%" stop-color="#0a7c3a"/>
      <stop offset="100%" stop-color="#054022"/>
    </radialGradient>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- Floor shadow under coin. -->
  <ellipse cx="240" cy="395" rx="130" ry="22" fill="#0e7490" opacity="0.5"/>

  <!-- Motion-trail arc. -->
  <g filter="url(#hotGlow)">
    <path d="M 90,420 Q 50,300 110,210 Q 180,160 230,170" stroke="#00e5ff" stroke-width="2.4" fill="none" stroke-dasharray="6 4" opacity="0.85"/>
    <circle cx="90"  cy="420" r="3" fill="#67e8f9"/>
    <circle cx="110" cy="210" r="3" fill="#ff4fd8"/>
    <circle cx="230" cy="170" r="3" fill="#67e8f9"/>
  </g>

  <!-- Coin (centered on canvas, slightly tilted). -->
  <g transform="translate(240 240) rotate(-12)" filter="url(#bigGlow)">
    <circle r="135" fill="none" stroke="url(#coinRim)" stroke-width="8"/>
    <circle r="139" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.65"/>
    <circle r="130" fill="url(#coinFace)"/>
    <circle r="115" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle r="111" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.7"/>
    <g stroke="#5a6b80" stroke-width="1.4" opacity="0.85">
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(0)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(10)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(20)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(30)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(40)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(50)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(60)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(70)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(80)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(90)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(100)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(110)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(120)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(130)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(140)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(150)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(160)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(170)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(180)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(190)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(200)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(210)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(220)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(230)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(240)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(250)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(260)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(270)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(280)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(290)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(300)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(310)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(320)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(330)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(340)"/>
      <line x1="0" y1="-130" x2="0" y2="-123" transform="rotate(350)"/>
    </g>

    <!-- GoonBet monogram: green disc + cyan stroke ring + dashed gold accent. -->
    <circle r="68" fill="url(#gFace)" stroke="#00e5ff" stroke-width="2" opacity="0.98"/>
    <circle r="62" fill="none" stroke="#fcd34d" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
    <!-- Bold "G" cut-out. -->
    <text x="0" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
  </g>
</svg>
