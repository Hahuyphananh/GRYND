<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Crash — neon line chart with crash explosion">
  <title>Crash</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#261c5b"/><stop offset="100%" stop-color="#030817"/></radialGradient>
    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse"><polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.22"/></pattern>
    <linearGradient id="crashLine" x1="0" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="60%" stop-color="#fcd34d"/><stop offset="90%" stop-color="#dc2626"/></linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/><rect width="480" height="480" fill="url(#hexGrid)"/>
  <ellipse cx="240" cy="270" rx="220" ry="180" fill="#5b21b6" opacity="0.18"/>
  <g opacity="0.08" fill="none" stroke="#00e5ff" stroke-width="0.5"><line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="100" x2="480" y2="100"/><line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="220" x2="480" y2="220"/><line x1="0" y1="280" x2="480" y2="280"/><line x1="0" y1="340" x2="480" y2="340"/><line x1="0" y1="400" x2="480" y2="400"/><line x1="0" y1="460" x2="480" y2="460"/></g>
  <g fill="#ffffff"><circle cx="40" cy="80" r="2" opacity="0.9"/><circle cx="440" cy="100" r="2.5" opacity="0.9"/><circle cx="50" cy="430" r="2" opacity="0.9"/><circle cx="430" cy="420" r="3" opacity="0.9"/><circle cx="240" cy="20" r="1.5" opacity="0.7"/><circle cx="55" cy="240" r="2" fill="#00e5ff" opacity="0.95"/><circle cx="425" cy="240" r="2" fill="#ff4fd8" opacity="0.95"/></g>
  <g transform="translate(240 56)">
    <rect x="-110" y="-22" width="220" height="40" rx="3" fill="#000816" stroke="#00e5ff" stroke-width="2" filter="url(#bigGlow)"/>
    <rect x="-104" y="-16" width="208" height="28" rx="2" fill="none" stroke="#ff4fd8" stroke-width="0.6" opacity="0.7"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="900" fill="#67e8f9" text-anchor="middle" letter-spacing="4">0x10  10.42x</text>
  </g>
  <g stroke="#ff4fd8" stroke-width="1.2" fill="none" stroke-linecap="round" filter="url(#hotGlow)">
    <polyline points="40,140 70,160 88,160 96,172"/><polyline points="40,200 56,200 70,210"/>
    <polyline points="440,140 410,160 392,160 384,172"/><polyline points="440,200 424,200 410,210"/>
    <circle cx="40" cy="140" r="2" fill="#ff4fd8"/><circle cx="40" cy="200" r="1.6" fill="#00e5ff"/>
    <circle cx="440" cy="140" r="2" fill="#ff4fd8"/><circle cx="440" cy="200" r="1.6" fill="#00e5ff"/>
  </g>
  <!-- Chart axes -->
  <g stroke="#0e7490" stroke-width="1.4" fill="none">
    <line x1="80" y1="100" x2="80" y2="410"/><line x1="80" y1="410" x2="420" y2="410"/>
  </g>
  <!-- Horizontal multiplier gridlines + labels -->
  <g font-family="'Courier New', Consolas, monospace" font-size="11" fill="#5a6b80">
    <g><line x1="80" y1="410" x2="420" y2="410" stroke="#0e7490" stroke-width="0.4" stroke-dasharray="2 4"/><text x="70" y="414" text-anchor="end">1.0x</text></g>
    <g><line x1="80" y1="350" x2="420" y2="350" stroke="#0e7490" stroke-width="0.4" stroke-dasharray="2 4"/><text x="70" y="354" text-anchor="end">2.0x</text></g>
    <g><line x1="80" y1="280" x2="420" y2="280" stroke="#0e7490" stroke-width="0.4" stroke-dasharray="2 4"/><text x="70" y="284" text-anchor="end">5.0x</text></g>
    <g><line x1="80" y1="200" x2="420" y2="200" stroke="#0e7490" stroke-width="0.4" stroke-dasharray="2 4"/><text x="70" y="204" text-anchor="end">10.0x</text></g>
    <g><line x1="80" y1="130" x2="420" y2="130" stroke="#0e7490" stroke-width="0.4" stroke-dasharray="2 4"/><text x="70" y="134" text-anchor="end">25.0x</text></g>
  </g>
  <!-- Crash line going up (1.0x at left, climbing to 10.42x at the crash point near upper-right). -->
  <polyline points="80,410 130,388 180,360 230,320 280,260 330,210 380,180" fill="none" stroke="url(#crashLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#bigGlow)"/>
  <polyline points="80,410 130,388 180,360 230,320 280,260 330,210 380,180" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rocket at current position just before crash. -->
  <g transform="translate(330 210) rotate(-30)" filter="url(#bigGlow)">
    <path d="M -10,0 L 0,-22 L 10,0 L 4,4 L -4,4 Z" fill="#dc2626" stroke="#0a1428" stroke-width="1.5"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="#fcd34d"/>
    <path d="M -4,4 L -8,12 M 4,4 L 8,12" stroke="#fb923c" stroke-width="2"/>
  </g>
  <!-- Crash explosion starburst at (380, 180). -->
  <g transform="translate(380 180)" filter="url(#hotGlow)">
    <g fill="#dc2626">
      <path d="M 0,-30 L 6,-12 L 22,-22 L 12,-6 L 30,0 L 12,6 L 22,22 L 6,12 L 0,30 L -6,12 L -22,22 L -12,6 L -30,0 L -12,-6 L -22,-22 L -6,-12 Z"/>
    </g>
    <circle r="8" fill="#fcd34d" filter="url(#bigGlow)"/>
    <circle r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(240 432)">
    <rect x="-90" y="-14" width="180" height="28" rx="3" fill="#000816" stroke="#dc2626" stroke-width="1" opacity="0.85"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle" letter-spacing="3">CRASHED  --  CASH  OUT</text>
  </g>
</svg>
