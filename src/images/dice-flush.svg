<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f5ff3b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyanGrad"   x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="dieGrad"   x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a2940"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="dieGradHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#243654"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="scorePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>

    <filter id="glowSoft"   x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowMedium" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/></filter>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="400" height="300" rx="20" fill="#0b1f3f"/>

  <!-- ═══════ SCORE SHEET ═══════ -->
  <g transform="translate(20 14)">
    <!-- Panel shell. -->
    <rect x="0" y="0" width="360" height="92" rx="6" fill="url(#scorePanel)" stroke="#00e5ff" stroke-width="1.4" filter="url(#glowSoft)"/>
    <!-- Top edge highlight. -->
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#00e5ff" opacity="0.75"/>
    <!-- Bottom edge glow line. -->
    <line x1="0" y1="89" x2="360" y2="89" stroke="#fcd34d" stroke-width="1" opacity="0.6"/>

    <!-- 5 column dividers for the 5 dice below. Cell width = 360/5 = 72. -->
    <g stroke="#00e5ff" stroke-width="0.7" opacity="0.45">
      <line x1="72"  y1="10" x2="72"  y2="82"/>
      <line x1="144" y1="10" x2="144" y2="82"/>
      <line x1="216" y1="10" x2="216" y2="82"/>
      <line x1="288" y1="10" x2="288" y2="82"/>
    </g>

    <!-- 2 ruled lines inside each cell (suggesting slots, hands, flush streaks). -->
    <g stroke="#67e8f9" stroke-width="0.5" opacity="0.55">
      <line x1="8"   y1="32" x2="64"  y2="32"/>
      <line x1="80"  y1="32" x2="136" y2="32"/>
      <line x1="152" y1="32" x2="208" y2="32"/>
      <line x1="224" y1="32" x2="280" y2="32"/>
      <line x1="296" y1="32" x2="352" y2="32"/>

      <line x1="8"   y1="56" x2="64"  y2="56"/>
      <line x1="80"  y1="56" x2="136" y2="56"/>
      <line x1="152" y1="56" x2="208" y2="56"/>
      <line x1="224" y1="56" x2="280" y2="56"/>
      <line x1="296" y1="56" x2="352" y2="56"/>
    </g>

    <!-- "Score dots" inside each cell — fill levels showing today's hand score. -->
    <g fill="#fcd34d">
      <!-- Cell 1 (5 pts) -->
      <circle cx="14"  cy="74" r="2.2"/>
      <circle cx="26"  cy="74" r="2.2"/>
      <circle cx="38"  cy="74" r="2.2"/>
      <circle cx="50"  cy="74" r="2.2" fill="#16a34a" opacity="0.4"/>
      <circle cx="62"  cy="74" r="2.2" fill="#16a34a" opacity="0.4"/>
    </g>
    <g fill="#fcd34d">
      <!-- Cell 2 (3 pts) -->
      <circle cx="86"  cy="74" r="2.2"/>
      <circle cx="98"  cy="74" r="2.2"/>
      <circle cx="110" cy="74" r="2.2"/>
    </g>
    <g fill="#fcd34d">
      <!-- Cell 3 (4 pts) -->
      <circle cx="158" cy="74" r="2.2"/>
      <circle cx="170" cy="74" r="2.2"/>
      <circle cx="182" cy="74" r="2.2"/>
      <circle cx="194" cy="74" r="2.2"/>
    </g>
    <g fill="#fcd34d">
      <!-- Cell 4 (2 pts) -->
      <circle cx="230" cy="74" r="2.2"/>
      <circle cx="242" cy="74" r="2.2"/>
    </g>
    <g fill="#fcd34d">
      <!-- Cell 5 (5 pts, full hand) -->
      <circle cx="302" cy="74" r="2.2"/>
      <circle cx="314" cy="74" r="2.2"/>
      <circle cx="326" cy="74" r="2.2"/>
      <circle cx="338" cy="74" r="2.2"/>
      <circle cx="350" cy="74" r="2.2"/>
    </g>
  </g>

  <!-- ═══════ DICE ROW — 5 dice centered horizontally ═══════
       Dice centers (y=190): x = 50, 125, 200, 275, 350 (step 75). Each die ~50 wide.
       Cells aligned with score-sheet columns above (cells at x=20+72k+36 = 56,128,200,272,344). -->

  <!-- Die 1 (left, showing 1) -->
  <g transform="translate(56 190) rotate(-10)" filter="url(#shadow)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#f5ff3b" filter="url(#glowSoft)"/>
  </g>

  <!-- Die 2 (showing 2) -->
  <g transform="translate(128 190) rotate(6)" filter="url(#shadow)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="-7" cy="-7" r="3.6" fill="#f5ff3b"/>
    <circle cx="7"  cy="7"  r="3.6" fill="#f5ff3b"/>
  </g>

  <!-- Die 3 hero (center, showing 5, glowing) -->
  <g transform="translate(200 190) rotate(0)" filter="url(#glowMedium)">
    <rect x="-28" y="-28" width="56" height="56" rx="11" fill="url(#dieGradHi)" stroke="url(#accentGrad)" stroke-opacity="0.7" stroke-width="2.4" filter="url(#glowSoft)"/>
    <circle cx="-12" cy="-12" r="4.2" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="12"  cy="-12" r="4.2" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="0"   cy="0"   r="4.2" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="-12" cy="12"  r="4.2" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="12"  cy="12"  r="4.2" fill="#f5ff3b" filter="url(#glowSoft)"/>
  </g>

  <!-- Die 4 (showing 3) -->
  <g transform="translate(272 190) rotate(-7)" filter="url(#shadow)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="-7" cy="-7" r="3.6" fill="#f5ff3b"/>
    <circle cx="0"  cy="0"  r="3.6" fill="#f5ff3b"/>
    <circle cx="7"  cy="7"  r="3.6" fill="#f5ff3b"/>
  </g>

  <!-- Die 5 (right, showing 4) -->
  <g transform="translate(344 190) rotate(11)" filter="url(#shadow)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="-7" cy="-7" r="3.4" fill="#f5ff3b"/>
    <circle cx="7"  cy="-7" r="3.4" fill="#f5ff3b"/>
    <circle cx="-7" cy="7"  r="3.4" fill="#f5ff3b"/>
    <circle cx="7"  cy="7"  r="3.4" fill="#f5ff3b"/>
  </g>

  <!-- Connector arrows (subtle) hinting at scoring flow from score-sheet to dice. -->
  <g stroke="#00e5ff" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.45">
    <line x1="56"  y1="106" x2="56"  y2="166"/>
    <line x1="128" y1="106" x2="128" y2="166"/>
    <line x1="200" y1="106" x2="200" y2="160"/>
    <line x1="272" y1="106" x2="272" y2="166"/>
    <line x1="344" y1="106" x2="344" y2="166"/>
  </g>
</svg>
