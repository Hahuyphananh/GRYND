<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030817"/>
      <stop offset="40%" stop-color="#071430"/>
      <stop offset="100%" stop-color="#0a1f4a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ff3b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="dieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2940"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="dieGradHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243654"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMedium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowTitle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- Scorecard pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#f5ff3b" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="400" height="300" rx="20" fill="url(#grid)"/>

  <!-- Border glow -->
  <rect x="2" y="2" width="396" height="296" rx="19" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1.5"/>
  <rect x="1" y="1" width="398" height="298" rx="20" stroke="#f5ff3b" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ── Decorative score lines (background) ── -->
  <g opacity="0.06">
    <line x1="20" y1="40" x2="380" y2="40" stroke="#f5ff3b" stroke-width="0.5"/>
    <line x1="20" y1="60" x2="380" y2="60" stroke="#f5ff3b" stroke-width="0.5"/>
    <line x1="20" y1="80" x2="380" y2="80" stroke="#f5ff3b" stroke-width="0.5"/>
    <line x1="20" y1="100" x2="380" y2="100" stroke="#f5ff3b" stroke-width="0.5"/>
    <line x1="20" y1="120" x2="380" y2="120" stroke="#f5ff3b" stroke-width="0.5"/>
  </g>

  <!-- ── Floating score numbers (background atmosphere) ── -->
  <g opacity="0.08" font-family="monospace" font-size="14" font-weight="900" fill="#00e5ff">
    <text x="30" y="170">+50</text>
    <text x="330" y="90">+35</text>
    <text x="50" y="230">+25</text>
    <text x="310" y="200">+40</text>
  </g>

  <!-- ═══════ MAIN DICE ARRANGEMENT ═══════ -->

  <!-- Die 1 (back left, showing 1) - smaller, farther back -->
  <g transform="translate(95, 55) rotate(-12)" filter="url(#shadow)" opacity="0.85">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
  </g>

  <!-- Die 2 (center, hero die showing 5) - largest, glowing -->
  <g transform="translate(180, 65) rotate(3)" filter="url(#glowMedium)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="url(#dieGradHighlight)" stroke="url(#accentGrad)" stroke-opacity="0.6" stroke-width="2.5" filter="url(#glowSoft)"/>
    <circle cx="-12" cy="-12" r="4.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="12" cy="-12" r="4.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="0" cy="0" r="4.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="-12" cy="12" r="4.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
    <circle cx="12" cy="12" r="4.5" fill="#f5ff3b" filter="url(#glowSoft)"/>
  </g>

  <!-- Die 3 (right, showing 3) -->
  <g transform="translate(275, 70) rotate(18)" filter="url(#shadow)" opacity="0.9">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="-6" cy="-6" r="3.5" fill="#f5ff3b"/>
    <circle cx="0" cy="0" r="3.5" fill="#f5ff3b"/>
    <circle cx="6" cy="6" r="3.5" fill="#f5ff3b"/>
  </g>

  <!-- Die 4 (bottom left, showing 6) -->
  <g transform="translate(120, 175) rotate(-7)" filter="url(#shadow)" opacity="0.9">
    <rect x="-23" y="-23" width="46" height="46" rx="10" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="-8" cy="-12" r="3" fill="#f5ff3b"/>
    <circle cx="8" cy="-12" r="3" fill="#f5ff3b"/>
    <circle cx="-8" cy="0" r="3" fill="#f5ff3b"/>
    <circle cx="8" cy="0" r="3" fill="#f5ff3b"/>
    <circle cx="-8" cy="12" r="3" fill="#f5ff3b"/>
    <circle cx="8" cy="12" r="3" fill="#f5ff3b"/>
  </g>

  <!-- Die 5 (bottom right, showing 2) -->
  <g transform="translate(245, 185) rotate(14)" filter="url(#shadow)" opacity="0.85">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="url(#dieGrad)" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="-6" cy="-6" r="3.5" fill="#f5ff3b"/>
    <circle cx="6" cy="6" r="3.5" fill="#f5ff3b"/>
  </g>

  <!-- ═══════ TITLE AREA ═══════ -->

  <!-- Title accent line -->
  <line x1="60" y1="248" x2="340" y2="248" stroke="url(#accentGrad)" stroke-opacity="0.3" stroke-width="1"/>

  <!-- DICE text -->
  <text x="200" y="238" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="6" filter="url(#glowTitle)">
    <tspan fill="#f5ff3b">DICE</tspan>
    <tspan fill="#00e5ff" letter-spacing="6"> FLUSH</tspan>
  </text>

  <!-- Subtitle -->
  <text x="200" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#00e5ff" fill-opacity="0.5" letter-spacing="4">
    ROLL • HOLD • OUTSCORE
  </text>

  <!-- Small decorative diamonds -->
  <g opacity="0.25">
    <polygon points="155,270 159,274 155,278 151,274" fill="#f5ff3b"/>
    <polygon points="245,270 249,274 245,278 241,274" fill="#f5ff3b"/>
  </g>
</svg>
