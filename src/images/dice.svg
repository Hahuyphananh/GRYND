<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Dice Duel — two dice clashing, red vs blue with a lightning impact">
  <title>Dice Duel Arena</title>
  <defs>
    <!-- Tight glow for dice bodies / chip-like elements. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow reserved for the impact / lightning bolt area. -->
    <filter id="clashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Casino-night backdrop. -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <!-- Die body — light top into a hint of shadow. -->
    <linearGradient id="dieBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde2ea"/>
    </linearGradient>

    <!-- Lightning bolt fill — pale gold into deep amber. -->
    <linearGradient id="boltGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaa8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- LEFT die — Player 1 (RED) — face 5, tilted slightly counter-clockwise (top edge slipping toward center). -->
  <g transform="rotate(-8 140 240)" filter="url(#neonGlow)">
    <rect x="85" y="185" width="110" height="110" rx="14" fill="url(#dieBody)" stroke="#ff3045" stroke-width="3.5"/>
    <!-- Inner soft border for depth. -->
    <rect x="91" y="191" width="98" height="98" rx="10" fill="none" stroke="#ffb3c0" stroke-width="0.8" opacity="0.7"/>
    <!-- 5 pips in face-5 pattern (4 corners + center). -->
    <g fill="#dc1f3a">
      <circle cx="115" cy="215" r="7"/>
      <circle cx="165" cy="215" r="7"/>
      <circle cx="140" cy="240" r="7"/>
      <circle cx="115" cy="265" r="7"/>
      <circle cx="165" cy="265" r="7"/>
    </g>
    <!-- Pip highlights for slight roundness. -->
    <g fill="#ffd6dc" opacity="0.6">
      <circle cx="113" cy="213" r="2"/>
      <circle cx="163" cy="213" r="2"/>
      <circle cx="138" cy="238" r="2"/>
      <circle cx="113" cy="263" r="2"/>
      <circle cx="163" cy="263" r="2"/>
    </g>
    <!-- Subtle top-light highlight on die body. -->
    <rect x="92" y="192" width="96" height="14" rx="6" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- RIGHT die — Player 2 (BLUE) — face 6, tilted slightly clockwise. -->
  <g transform="rotate(8 340 240)" filter="url(#neonGlow)">
    <rect x="285" y="185" width="110" height="110" rx="14" fill="url(#dieBody)" stroke="#67e8f9" stroke-width="3.5"/>
    <rect x="291" y="191" width="98" height="98" rx="10" fill="none" stroke="#a5f3fc" stroke-width="0.8" opacity="0.7"/>
    <!-- 6 pips in 2 rows × 3 cols. -->
    <g fill="#0891b2">
      <circle cx="315" cy="215" r="7"/>
      <circle cx="340" cy="215" r="7"/>
      <circle cx="365" cy="215" r="7"/>
      <circle cx="315" cy="265" r="7"/>
      <circle cx="340" cy="265" r="7"/>
      <circle cx="365" cy="265" r="7"/>
    </g>
    <g fill="#cffafe" opacity="0.6">
      <circle cx="313" cy="213" r="2"/>
      <circle cx="338" cy="213" r="2"/>
      <circle cx="363" cy="213" r="2"/>
      <circle cx="313" cy="263" r="2"/>
      <circle cx="338" cy="263" r="2"/>
      <circle cx="363" cy="263" r="2"/>
    </g>
    <rect x="292" y="192" width="96" height="14" rx="6" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Clash impact: lightning bolt + radiating sparks at the center between the two dice. -->
  <g filter="url(#clashGlow)">
    <!-- Lightning bolt — 6-vertex zigzag polygon. -->
    <path d="M 252,196 L 224,242 L 246,242 L 228,284 L 256,238 L 240,238 Z"
          fill="url(#boltGold)" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <!-- Radiating spark lines around the impact. -->
  <g stroke="#ffd131" stroke-width="2.5" stroke-linecap="round" filter="url(#clashGlow)">
    <line x1="240" y1="172" x2="240" y2="156"/>
    <line x1="212" y1="186" x2="198" y2="172"/>
    <line x1="268" y1="186" x2="282" y2="172"/>
    <line x1="186" y1="222" x2="166" y2="218"/>
    <line x1="294" y1="222" x2="314" y2="218"/>
    <line x1="200" y1="294" x2="186" y2="304"/>
    <line x1="280" y1="294" x2="294" y2="304"/>
    <line x1="240" y1="312" x2="240" y2="326"/>
  </g>
</svg>
