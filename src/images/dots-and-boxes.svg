<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Dots and Boxes game thumbnail">
  <defs>
    <linearGradient id="dbg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f3f" />
      <stop offset="55%" stop-color="#0a1530" />
      <stop offset="100%" stop-color="#000912" />
    </linearGradient>
    <radialGradient id="dbg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dbg-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="dbg-host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="dbg-guest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.55" />
    </linearGradient>
    <filter id="dbg-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect x="0" y="0" width="600" height="400" rx="22" fill="#0b1f3f"/>

  <!-- ─── Board area ─────────────────────────────────────────────────── -->
  <!-- The board group is centered horizontally and sits in the lower half. -->
  <!-- We use a 5x5 dot layout (6x6=25 boxes → a tidy thumbnail size). -->
  <g transform="translate(170, 110)">
    <!-- Soft glow behind the board -->
    <rect x="-26" y="-26" width="292" height="332" rx="14" fill="#f59e0b" fill-opacity="0.07" />

    <!-- Widget frame -->
    <rect x="-20" y="-20" width="280" height="320" rx="12" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1" />

    <!-- Box cell guides (light) -->
    <g fill="#fbbf24" fill-opacity="0.04">
      <rect x="10" y="10" width="220" height="260" rx="6" />
    </g>

    <!-- ─── Claimed boxes (use fills so it reads as "boxes owned") ──── -->
    <!-- Player 1 (host = amber) claimed boxes: middle-left chunk -->
    <g>
      <rect x="10" y="68" width="55" height="55" rx="4" fill="url(#dbg-host)" fill-opacity="0.32" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1" />
      <rect x="65" y="68" width="55" height="55" rx="4" fill="url(#dbg-host)" fill-opacity="0.32" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1" />
      <rect x="10" y="123" width="55" height="55" rx="4" fill="url(#dbg-host)" fill-opacity="0.32" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1" />
    </g>
    <!-- Player 2 (guest = orange) claimed boxes: bottom-right -->
    <g>
      <rect x="120" y="123" width="55" height="55" rx="4" fill="url(#dbg-guest)" fill-opacity="0.32" stroke="#f97316" stroke-opacity="0.6" stroke-width="1" />
      <rect x="175" y="123" width="55" height="55" rx="4" fill="url(#dbg-guest)" fill-opacity="0.32" stroke="#f97316" stroke-opacity="0.6" stroke-width="1" />
      <rect x="175" y="178" width="55" height="55" rx="4" fill="url(#dbg-guest)" fill-opacity="0.32" stroke="#f97316" stroke-opacity="0.6" stroke-width="1" />
    </g>

    <!-- ─── Drawn horizontal edges (top→bottom on the y-axis) ──────── -->
    <!-- Each segment sits AT a dot row (y=10,65,120,175,230,270). -->
    <g stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="10" y1="10"  x2="65"  y2="10" />
      <line x1="65" y1="10"  x2="120" y2="10" />
      <line x1="120" y1="10" x2="175" y2="10" />
      <line x1="175" y1="10" x2="230" y2="10" />

      <line x1="10" y1="65"  x2="65"  y2="65" />
      <line x1="120" y1="65" x2="175" y2="65" />
      <line x1="175" y1="65" x2="230" y2="65" />

      <line x1="10" y1="120" x2="65"  y2="120" />
      <line x1="65" y1="120" x2="120" y2="120" />
      <line x1="120" y1="120" x2="175" y2="120" />

      <line x1="10" y1="175" x2="65"  y2="175" />
      <line x1="65" y1="175" x2="120" y2="175" />
      <line x1="120" y1="175" x2="175" y2="175" />
      <line x1="175" y1="175" x2="230" y2="175" />

      <line x1="120" y1="230" x2="175" y2="230" />
      <line x1="175" y1="230" x2="230" y2="230" />
    </g>

    <!-- ─── Drawn vertical edges ───────────────────────────────────── -->
    <g stroke="#fdba74" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="10" y1="10"  x2="10"  y2="65" />
      <line x1="10" y1="65"  x2="10"  y2="120" />
      <line x1="10" y1="120" x2="10"  y2="175" />
      <line x1="10" y1="175" x2="10"  y2="230" />
      <line x1="10" y1="230" x2="10"  y2="270" />

      <line x1="65" y1="10"  x2="65"  y2="65" />
      <line x1="65" y1="65"  x2="65"  y2="120" />
      <line x1="65" y1="120" x2="65"  y2="175" />
      <line x1="65" y1="175" x2="65"  y2="230" />

      <line x1="120" y1="10" x2="120" y2="65" />
      <line x1="120" y1="65" x2="120" y2="120" />
      <line x1="120" y1="120" x2="120" y2="175" />
      <line x1="120" y1="175" x2="120" y2="230" />

      <line x1="175" y1="65" x2="175" y2="120" />
      <line x1="175" y1="120" x2="175" y2="175" />
      <line x1="175" y1="175" x2="175" y2="230" />

      <line x1="230" y1="10" x2="230" y2="65" />
      <line x1="230" y1="65" x2="230" y2="120" />
      <line x1="230" y1="120" x2="230" y2="175" />
      <line x1="230" y1="175" x2="230" y2="230" />
      <line x1="230" y1="230" x2="230" y2="270" />
    </g>

    <!-- ─── Dots ───────────────────────────────────────────────────── -->
    <!-- Faint outline glow ring behind each dot for a "glowing pen-tip" feel -->
    <g>
      <circle cx="10"  cy="10"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="10"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="10"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="10"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="10"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />

      <circle cx="10"  cy="65"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="65"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="65"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="65"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="65"  r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />

      <circle cx="10"  cy="120" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="120" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="120" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="120" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="120" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />

      <circle cx="10"  cy="175" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="175" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="175" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="175" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="175" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />

      <circle cx="10"  cy="230" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="230" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="230" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="230" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="230" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />

      <circle cx="10"  cy="270" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="65"  cy="270" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="120" cy="270" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="175" cy="270" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
      <circle cx="230" cy="270" r="9" fill="#fbbf24" fill-opacity="0.25" filter="url(#dbg-shadow)" />
    </g>

    <!-- Solid filled dots -->
    <g fill="#fbbf24">
      <circle cx="10"  cy="10"  r="4.5" />
      <circle cx="65"  cy="10"  r="4.5" />
      <circle cx="120" cy="10"  r="4.5" />
      <circle cx="175" cy="10"  r="4.5" />
      <circle cx="230" cy="10"  r="4.5" />

      <circle cx="10"  cy="65"  r="4.5" />
      <circle cx="65"  cy="65"  r="4.5" />
      <circle cx="120" cy="65"  r="4.5" />
      <circle cx="175" cy="65"  r="4.5" />
      <circle cx="230" cy="65"  r="4.5" />

      <circle cx="10"  cy="120" r="4.5" />
      <circle cx="65"  cy="120" r="4.5" />
      <circle cx="120" cy="120" r="4.5" />
      <circle cx="175" cy="120" r="4.5" />
      <circle cx="230" cy="120" r="4.5" />

      <circle cx="10"  cy="175" r="4.5" />
      <circle cx="65"  cy="175" r="4.5" />
      <circle cx="120" cy="175" r="4.5" />
      <circle cx="175" cy="175" r="4.5" />
      <circle cx="230" cy="175" r="4.5" />

      <circle cx="10"  cy="230" r="4.5" />
      <circle cx="65"  cy="230" r="4.5" />
      <circle cx="120" cy="230" r="4.5" />
      <circle cx="175" cy="230" r="4.5" />
      <circle cx="230" cy="230" r="4.5" />

      <circle cx="10"  cy="270" r="4.5" />
      <circle cx="65"  cy="270" r="4.5" />
      <circle cx="120" cy="270" r="4.5" />
      <circle cx="175" cy="270" r="4.5" />
      <circle cx="230" cy="270" r="4.5" />
    </g>

  </g>
</svg>
