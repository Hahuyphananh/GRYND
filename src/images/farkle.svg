<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533" />
      <stop offset="100%" stop-color="#0a1630" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="400" height="300" rx="16" fill="#0b1f3f"/>

  <!-- Grid of 6 dice -->
  <!-- Die 1 (top-left) - face 6 -->
  <g transform="translate(70, 50)">
    <rect width="72" height="72" rx="14" fill="white" stroke="#d97706" stroke-width="3" />
    <circle cx="22" cy="22" r="7" fill="#1a0533" />
    <circle cx="50" cy="22" r="7" fill="#1a0533" />
    <circle cx="22" cy="36" r="7" fill="#1a0533" />
    <circle cx="50" cy="36" r="7" fill="#1a0533" />
    <circle cx="22" cy="50" r="7" fill="#1a0533" />
    <circle cx="50" cy="50" r="7" fill="#1a0533" />
  </g>

  <!-- Die 2 (top-middle) - face 1 -->
  <g transform="translate(164, 50)">
    <rect width="72" height="72" rx="14" fill="#fbbf24" stroke="#d97706" stroke-width="3" filter="url(#glow)"/>
    <circle cx="36" cy="36" r="7" fill="#92400e" />
  </g>

  <!-- Die 3 (top-right) - face 5 -->
  <g transform="translate(258, 50)">
    <rect width="72" height="72" rx="14" fill="white" stroke="#d97706" stroke-width="3" />
    <circle cx="22" cy="22" r="7" fill="#1a0533" />
    <circle cx="50" cy="22" r="7" fill="#1a0533" />
    <circle cx="36" cy="36" r="7" fill="#1a0533" />
    <circle cx="22" cy="50" r="7" fill="#1a0533" />
    <circle cx="50" cy="50" r="7" fill="#1a0533" />
  </g>

  <!-- Die 4 (bottom-left) - face 4 -->
  <g transform="translate(70, 148)">
    <rect width="72" height="72" rx="14" fill="white" stroke="#d97706" stroke-width="3" />
    <circle cx="22" cy="22" r="7" fill="#1a0533" />
    <circle cx="50" cy="22" r="7" fill="#1a0533" />
    <circle cx="22" cy="50" r="7" fill="#1a0533" />
    <circle cx="50" cy="50" r="7" fill="#1a0533" />
  </g>

  <!-- Die 5 (bottom-middle) - face 3 -->
  <g transform="translate(164, 148)">
    <rect width="72" height="72" rx="14" fill="white" stroke="#d97706" stroke-width="3" />
    <circle cx="22" cy="22" r="7" fill="#1a0533" />
    <circle cx="36" cy="36" r="7" fill="#1a0533" />
    <circle cx="50" cy="50" r="7" fill="#1a0533" />
  </g>

  <!-- Die 6 (bottom-right) - face 2 -->
  <g transform="translate(258, 148)">
    <rect width="72" height="72" rx="14" fill="white" stroke="#d97706" stroke-width="3" />
    <circle cx="22" cy="50" r="7" fill="#1a0533" />
    <circle cx="50" cy="22" r="7" fill="#1a0533" />
  </g>

</svg>
