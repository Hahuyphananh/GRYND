<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="hs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1226" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <radialGradient id="hs-halo" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.20" />
      <stop offset="58%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04060f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hs-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b4d" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#hs-sky)" />
  <rect width="400" height="300" fill="url(#hs-halo)" />

  <!-- The mirrored battlefield: two hills, one shared valley -->
  <path d="M0 300 L0 196 C46 196 62 150 104 150 C146 150 158 208 196 234
           C216 248 236 234 246 214 C268 172 300 148 332 156 C368 164 372 208 400 214
           L400 300 Z" fill="url(#hs-ground)" stroke="#2b3560" stroke-width="2" />

  <!-- The projectile arc: what the server resolves and every client replays -->
  <path d="M78 150 C150 34 262 30 330 152" fill="none" stroke="#f472b6"
    stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="1.6s" repeatCount="indefinite" />
  </path>
  <circle r="5" fill="#fbcfe8">
    <animateMotion dur="2.4s" repeatCount="indefinite"
      path="M78 150 C150 34 262 30 330 152" />
  </circle>

  <!-- Left launcher -->
  <g transform="translate(78 150)">
    <rect x="-13" y="-6" width="26" height="14" rx="5" fill="#38bdf8" />
    <rect x="-4" y="-16" width="8" height="14" rx="3" fill="#7dd3fc" transform="rotate(-38)" />
    <circle cx="0" cy="10" r="7" fill="#0b1226" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Right launcher -->
  <g transform="translate(330 152)">
    <rect x="-13" y="-6" width="26" height="14" rx="5" fill="#f472b6" />
    <rect x="-4" y="-16" width="8" height="14" rx="3" fill="#fbcfe8" transform="rotate(38)" />
    <circle cx="0" cy="10" r="7" fill="#0b1226" stroke="#f472b6" stroke-width="2" />
  </g>

  <!-- Structure: the tower blocks a shot can crater but never kill through -->
  <g fill="#26315a" stroke="#46528a">
    <rect x="164" y="210" width="30" height="30" rx="3" />
    <rect x="200" y="210" width="30" height="30" rx="3" />
    <rect x="182" y="178" width="30" height="30" rx="3" />
    <rect x="198" y="146" width="18" height="30" rx="3" fill="#2f3d6e" />
  </g>
  <g fill="#f472b6" opacity="0.55">
    <rect x="168" y="214" width="6" height="6" rx="1" />
    <rect x="220" y="200" width="6" height="6" rx="1" />
  </g>

  <!-- Three lives a seat: a direct hit removes exactly one -->
  <g>
    <circle cx="78" cy="182" r="4.5" fill="#38bdf8" />
    <circle cx="94" cy="182" r="4.5" fill="#38bdf8" />
    <circle cx="110" cy="182" r="4.5" fill="#38bdf8" />
    <circle cx="290" cy="184" r="4.5" fill="#f472b6" />
    <circle cx="306" cy="184" r="4.5" fill="#f472b6" />
    <circle cx="322" cy="184" r="4.5" fill="#f472b6" />
  </g>

  <!-- Two seats, one shared battlefield -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="13">
    <rect x="132" y="40" width="136" height="30" rx="15" fill="#171f3c" stroke="#2b3560" />
    <circle cx="156" cy="55" r="7" fill="#38bdf8" />
    <circle cx="244" cy="55" r="7" fill="#f472b6" />
    <text x="200" y="60" fill="#c7d2fe" text-anchor="middle">1v1 · 3 lives</text>
  </g>
</svg>
