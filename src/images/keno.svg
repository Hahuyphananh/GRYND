      <text x="56"  y="131">1</text><text x="96"  y="131">2</text><text x="136" y="131">3</text><text x="176" y="131">4</text><text x="216" y="131">5</text>
      <text x="256" y="131">6</text><text x="336" y="131">8</text><text x="376" y="131">9</text><text x="416" y="131">10</text>
      <text x="56"  y="171">11</text><text x="96"  y="171">12</text><text x="136" y="171">13</text><text x="216" y="171">15</text><text x="256" y="171">16</text>
