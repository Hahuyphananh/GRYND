<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Keno — 80-number keno grid with seven neon-highlighted drawn numbers on a hex-grid backdrop">
  <title>Keno</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#261c5b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse">
      <polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.22"/>
    </pattern>

    <linearGradient id="cellIdle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="cellDrawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- Keno grid — 10 columns x 8 rows of numbers 1-80, cell 32x32, stride 40. -->
  <!-- Row N (y=110 + N*40), col M (x=40 + M*40). Cell centers at x=56,96,...,416 (col*40+16), y=126,166,...,446. -->
  <g font-family="'Courier New', Consolas, monospace" font-size="13" font-weight="900" text-anchor="middle">
    <!-- All 80 idle cells (drawn first, drawn-number cells get overlaid on these later). -->
    <g>
      <!-- Row 0: 1-10, top y=110 -->
      <rect x="40" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="80" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="120" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="160" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="200" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="240" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="280" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="320" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="360" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="400" y="110" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <!-- Row 1: 11-20 -->
      <rect x="40" y="150" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="80" y="150" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="120" y="150" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="160" y="150" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
