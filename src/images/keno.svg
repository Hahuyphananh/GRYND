      <rect x="80" y="270" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="120" y="270" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="160" y="270" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
