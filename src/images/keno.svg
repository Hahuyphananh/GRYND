      <rect x="280" y="310" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="320" y="310" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="360" y="310" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
