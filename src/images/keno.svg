      <rect x="80" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="120" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="160" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="200" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="240" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="280" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="320" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
      <rect x="360" y="390" width="32" height="32" rx="3" fill="url(#cellIdle)" stroke="#1f3a5a" stroke-width="0.6"/>
