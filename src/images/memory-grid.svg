<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#001933"/>
      <stop offset="55%"  stop-color="#00264d"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="cardUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1f3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Marine blue backdrop + halo. -->
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#halo)"/>

  <!-- 4×4 grid: 44px cards, 8px gap → 4*44 + 3*8 = 200.
       Centered: x = (400-200)/2 = 100, y = (225-200)/2 = 12.5. -->
  <g transform="translate(100 12.5)" filter="url(#neonGlow)">
    <!-- Row 0 -->
    <rect x="0"   y="0"  width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="52"  y="0"  width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="104" y="0"  width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="156" y="0"  width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <!-- Row 1 — P1 just matched a pair (amber cards face-up). -->
    <rect x="0"   y="52" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="52"  y="52" width="44" height="44" rx="5" fill="url(#cardUp)" stroke="#fde68a" stroke-width="0.9"/>
    <text x="74"  y="80" text-anchor="middle" font-size="22" fill="#1a0f00" font-weight="900">🍒</text>
    <rect x="104" y="52" width="44" height="44" rx="5" fill="url(#cardUp)" stroke="#fde68a" stroke-width="0.9"/>
    <text x="126" y="80" text-anchor="middle" font-size="22" fill="#1a0f00" font-weight="900">🍒</text>
    <rect x="156" y="52" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <!-- Row 2 — P2's turn: one card face-up mid-flip, rest face-down. -->
    <rect x="0"   y="104" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="52"  y="104" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="104" y="104" width="44" height="44" rx="5" fill="url(#cardUp)" stroke="#fde68a" stroke-width="0.9"/>
    <text x="126" y="132" text-anchor="middle" font-size="22" fill="#1a0f00" font-weight="900">💎</text>
    <rect x="156" y="104" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <!-- Row 3 -->
    <rect x="0"   y="156" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="52"  y="156" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="104" y="156" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
    <rect x="156" y="156" width="44" height="44" rx="5" fill="#082345" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.7"/>
  </g>
</svg>
