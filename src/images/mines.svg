<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Mines — neon 5x5 grid with revealed tiles and a mine">
  <title>Mines</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#261c5b"/><stop offset="100%" stop-color="#030817"/></radialGradient>
    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse"><polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.22"/></pattern>
    <linearGradient id="tileHidden" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e7490"/><stop offset="100%" stop-color="#0a1428"/></linearGradient>
    <linearGradient id="tileSafe" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a7c3a"/><stop offset="100%" stop-color="#054022"/></linearGradient>
    <linearGradient id="tileMine" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#5a0014"/></linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/><rect width="480" height="480" fill="url(#hexGrid)"/>
  <ellipse cx="240" cy="270" rx="220" ry="180" fill="#5b21b6" opacity="0.18"/>
  <g opacity="0.08" fill="none" stroke="#00e5ff" stroke-width="0.5"><line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="100" x2="480" y2="100"/><line x1="0" y1="160" x2="180" y2="160"/><line x1="0" y1="220" x2="480" y2="220"/><line x1="0" y1="280" x2="480" y2="280"/><line x1="0" y1="340" x2="480" y2="340"/><line x1="0" y1="400" x2="480" y2="400"/><line x1="0" y1="460" x2="480" y2="460"/></g>
  <g fill="#ffffff"><circle cx="40" cy="80" r="2" opacity="0.9"/><circle cx="440" cy="100" r="2.5" opacity="0.9"/><circle cx="50" cy="430" r="2" opacity="0.9"/><circle cx="430" cy="420" r="3" opacity="0.9"/><circle cx="240" cy="20" r="1.5" opacity="0.7"/><circle cx="55" cy="240" r="2" fill="#00e5ff" opacity="0.95"/><circle cx="425" cy="240" r="2" fill="#ff4fd8" opacity="0.95"/></g>
  <g transform="translate(240 56)">
    <rect x="-110" y="-22" width="220" height="40" rx="3" fill="#000816" stroke="#00e5ff" stroke-width="2" filter="url(#bigGlow)"/>
    <rect x="-104" y="-16" width="208" height="28" rx="2" fill="none" stroke="#ff4fd8" stroke-width="0.6" opacity="0.7"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="900" fill="#67e8f9" text-anchor="middle" letter-spacing="4">0x09  MINES  3</text>
  </g>
  <g stroke="#ff4fd8" stroke-width="1.2" fill="none" stroke-linecap="round" filter="url(#hotGlow)">
    <polyline points="40,140 70,160 88,160 96,172"/><polyline points="40,200 56,200 70,210"/>
    <polyline points="440,140 410,160 392,160 384,172"/><polyline points="440,200 424,200 410,210"/>
    <circle cx="40" cy="140" r="2" fill="#ff4fd8"/><circle cx="40" cy="200" r="1.6" fill="#00e5ff"/>
    <circle cx="440" cy="140" r="2" fill="#ff4fd8"/><circle cx="440" cy="200" r="1.6" fill="#00e5ff"/>
  </g>
  <!-- 5x5 grid: cell stride 60, cell size 50. Top-left grid at (90, 100). Cell centers at (115, 175, 235, 295, 355). -->
  <g>
    <!-- Row 0 -->
    <rect x="90" y="100" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="150" y="100" width="50" height="50" rx="6" fill="url(#tileSafe)" stroke="#16a34a" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="175" y="135" font-family="serif, Georgia" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="210" y="100" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="270" y="100" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="330" y="100" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <!-- Row 1 -->
    <rect x="90" y="160" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="150" y="160" width="50" height="50" rx="6" fill="url(#tileSafe)" stroke="#16a34a" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="175" y="195" font-family="serif, Georgia" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="210" y="160" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="270" y="160" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="330" y="160" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <!-- Row 2 -->
    <rect x="90" y="220" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="150" y="220" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="210" y="220" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="270" y="220" width="50" height="50" rx="6" fill="url(#tileSafe)" stroke="#16a34a" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="295" y="255" font-family="serif, Georgia" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="330" y="220" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <!-- Row 3 -->
    <rect x="90" y="280" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="150" y="280" width="50" height="50" rx="6" fill="url(#tileSafe)" stroke="#16a34a" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="175" y="315" font-family="serif, Georgia" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="210" y="280" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="270" y="280" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="330" y="280" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <!-- Row 4 -->
    <rect x="90" y="340" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="150" y="340" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="210" y="340" width="50" height="50" rx="6" fill="url(#tileMine)" stroke="#dc2626" stroke-width="2" filter="url(#bigGlow)"/>
    <circle cx="235" cy="365" r="10" fill="none" stroke="#fcd34d" stroke-width="2.5"/>
    <line x1="225" y1="365" x2="245" y2="365" stroke="#fcd34d" stroke-width="2.5"/>
    <line x1="235" y1="355" x2="235" y2="375" stroke="#fcd34d" stroke-width="2.5"/>
    <circle cx="235" cy="365" r="3" fill="#fcd34d"/>
    <rect x="270" y="340" width="50" height="50" rx="6" fill="url(#tileHidden)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="330" y="340" width="50" height="50" rx="6" fill="url(#tileSafe)" stroke="#16a34a" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="355" y="375" font-family="serif, Georgia" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  </g>
  <!-- Sparkle on revealed tiles. -->
  <g filter="url(#hotGlow)">
    <circle cx="195" cy="105" r="2" fill="#ff4fd8"/><circle cx="195" cy="165" r="2" fill="#ff4fd8"/>
    <circle cx="295" cy="225" r="2" fill="#ff4fd8"/><circle cx="195" cy="285" r="2" fill="#ff4fd8"/>
    <circle cx="375" cy="345" r="2" fill="#ff4fd8"/>
  </g>
  <g transform="translate(240 432)">
    <rect x="-90" y="-14" width="180" height="28" rx="3" fill="#000816" stroke="#ff4fd8" stroke-width="1" opacity="0.85"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="middle" letter-spacing="3">CASH OUT  --  5 / 22</text>
  </g>
</svg>
