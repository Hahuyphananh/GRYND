<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2f1d" />
      <stop offset="100%" stop-color="#04120b" />
    </linearGradient>
    <linearGradient id="mg-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#065f34" />
    </linearGradient>
    <radialGradient id="mg-halo" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#04120b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#mg-bg)" />
  <rect width="400" height="300" fill="url(#mg-halo)" />

  <!-- Green -->
  <rect x="74" y="42" width="252" height="216" rx="34" fill="url(#mg-green)" opacity="0.92" />
  <rect
    x="74"
    y="42"
    width="252"
    height="216"
    rx="34"
    fill="none"
    stroke="#0b3d24"
    stroke-width="6"
  />

  <!-- Sand bunker -->
  <ellipse cx="132" cy="150" rx="34" ry="22" fill="#e7c873" opacity="0.9" />

  <!-- Water hazard -->
  <ellipse cx="282" cy="196" rx="30" ry="20" fill="#2f7fd6" opacity="0.85" />

  <!-- Wall gate -->
  <rect x="74" y="112" width="64" height="10" rx="5" fill="#e2e8f0" />
  <rect x="228" y="112" width="98" height="10" rx="5" fill="#e2e8f0" />

  <!-- Cup -->
  <ellipse cx="200" cy="84" rx="20" ry="14" fill="#04140c" />
  <ellipse cx="200" cy="84" rx="20" ry="14" fill="none" stroke="#f5ff3b" stroke-width="4" />

  <!-- Flagstick -->
  <rect x="197" y="20" width="5" height="64" rx="2.5" fill="#e2e8f0" />
  <path d="M202 22 L262 38 L202 56 Z" fill="#ef4444" />

  <!-- Ball -->
  <circle cx="152" cy="228" r="13" fill="#22d3ee" stroke="#ffffff" stroke-width="3" />

  <!-- Aim guide -->
  <path
    d="M152 228 C 176 210, 214 150, 200 96"
    fill="none"
    stroke="#f5ff3b"
    stroke-width="3"
    stroke-dasharray="9 8"
    opacity="0.85"
  />

  <!-- "Best of 5 — first to 3" pips -->
  <g fill="#f5ff3b" opacity="0.9">
    <circle cx="176" cy="278" r="5" />
    <circle cx="196" cy="278" r="5" />
    <circle cx="216" cy="278" r="5" />
  </g>
  <g fill="#ffffff" opacity="0.35">
    <circle cx="236" cy="278" r="5" />
    <circle cx="256" cy="278" r="5" />
  </g>
</svg>
