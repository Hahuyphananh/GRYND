<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="swapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect width="400" height="225" rx="12"/>
    </clipPath>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="400" height="225" rx="12" fill="#0b1f3f"/>

  <!-- Shrinking range bar visualization (right side) -->
  <g transform="translate(250, 28)">
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#fbbf24" opacity="0.85"/>
    <text x="135" y="14" text-anchor="start" font-family="system-ui" font-size="12" font-weight="700" fill="#fbbf24">100</text>
    <rect x="0" y="24" width="65" height="16" rx="4" fill="#f59e0b" opacity="0.75"/>
    <text x="70" y="36" text-anchor="start" font-family="system-ui" font-size="12" font-weight="700" fill="#f59e0b">50</text>
    <rect x="0" y="46" width="33" height="14" rx="4" fill="#d97706" opacity="0.65"/>
    <text x="38" y="57" text-anchor="start" font-family="system-ui" font-size="11" font-weight="700" fill="#d97706">25</text>
    <rect x="0" y="66" width="16" height="12" rx="3" fill="#b45309" opacity="0.55"/>
    <text x="20" y="76" text-anchor="start" font-family="system-ui" font-size="10" font-weight="700" fill="#b45309">12</text>
    <rect x="0" y="84" width="8" height="10" rx="2" fill="#92400e" opacity="0.45"/>
    <text x="11" y="93" text-anchor="start" font-family="system-ui" font-size="9" font-weight="700" fill="#92400e">6</text>
    <rect x="0" y="100" width="4" height="9" rx="2" fill="#78350f" opacity="0.35"/>
    <text x="7" y="109" text-anchor="start" font-family="system-ui" font-size="8" font-weight="700" fill="#78350f">3→2</text>
    <path d="M-12,105 L-6,4 L0,105" stroke="#fbbf24" stroke-width="1.2" fill="none" opacity="0.35"/>
  </g>

  <!-- ====== Two number wheels with swap arrows ====== -->

  <!-- Top swap arrow (left → right, curved above) -->
  <g opacity="0.6" filter="url(#softGlow)">
    <path d="M105,42 Q140,12 175,42" stroke="url(#swapGrad)" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <polygon points="175,38 181,42 175,46" fill="#a855f7"/>
  </g>

  <!-- Bottom swap arrow (right → left, curved below) -->
  <g opacity="0.6" filter="url(#softGlow)">
    <path d="M175,148 Q140,178 105,148" stroke="url(#swapGrad)" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <polygon points="105,144 99,148 105,152" fill="#a855f7"/>
  </g>

  <!-- Left number circle -->
  <g transform="translate(75, 95)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="42" fill="#1a0533" stroke="url(#accent1)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="900" fill="url(#accent1)">?</text>
    <!-- Role label -->
    <text x="0" y="58" text-anchor="middle" font-family="system-ui" font-size="7" font-weight="700" fill="#fbbf24" opacity="0.7">STARTER</text>
  </g>

  <!-- Right number circle -->
  <g transform="translate(205, 95)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="42" fill="#1a0533" stroke="url(#accent2)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="900" fill="url(#accent2)">?</text>
    <!-- Role label -->
    <text x="0" y="58" text-anchor="middle" font-family="system-ui" font-size="7" font-weight="700" fill="#a855f7" opacity="0.7">CHALLENGER</text>
  </g>

</svg>
