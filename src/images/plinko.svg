<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Plinko — neon plinko board with circular pegs in a triangular layout and realistic high-edge / low-center multiplier slots">
  <title>Plinko</title>
  <defs>
    <!-- Tight glow for board frame, pegs, balls, and dividers. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow reserved for the highest-payout edge slots (1000x). -->
    <filter id="bigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Casino-night backdrop. -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <!-- Slot fills — center=0.5x (lowest payout), edges=1000x (highest payout). -->
    <linearGradient id="slotLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a1410"/>
      <stop offset="100%" stop-color="#3a0808"/>
    </linearGradient>
    <linearGradient id="slotMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#7c3a04"/>
    </linearGradient>
    <linearGradient id="slotHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a05a08"/>
    </linearGradient>
    <linearGradient id="slotMax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff36e"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <!-- Peg fill — silver chrome. -->
    <radialGradient id="pegChrome" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cfd8e3"/>
      <stop offset="100%" stop-color="#5a6b80"/>
    </radialGradient>

    <!-- Ball fills. -->
    <radialGradient id="redBall" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffb3c0"/>
      <stop offset="55%" stop-color="#ff3045"/>
      <stop offset="100%" stop-color="#9c0014"/>
    </radialGradient>
    <radialGradient id="cyanBall" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#cfd8e3"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
  </defs>

  <!-- Backdrop. -->
  <rect width="480" height="480" fill="url(#bg)"/>
  <ellipse cx="240" cy="220" rx="220" ry="180" fill="#5b21b6" opacity="0.22"/>

  <!-- Edge sparkles. -->
  <g fill="#ffffff">
    <circle cx="40"  cy="80"  r="2"   opacity="0.9"/>
    <circle cx="440" cy="100" r="2.5" opacity="0.9"/>
    <circle cx="50"  cy="430" r="2"   opacity="0.9"/>
    <circle cx="430" cy="420" r="3"   opacity="0.9"/>
    <circle cx="240" cy="20"  r="1.5" opacity="0.7"/>
    <circle cx="55"  cy="240" r="2"   fill="#00e5ff" opacity="0.85"/>
    <circle cx="425" cy="240" r="2"   fill="#ff4fd8" opacity="0.85"/>
  </g>

  <!-- Plinko board frame. -->
  <g filter="url(#neonGlow)">
    <rect x="80" y="40" width="320" height="400" rx="22" fill="#0c1e3f" stroke="#67e8f9" stroke-width="3"/>
    <line x1="100" y1="48" x2="380" y2="48" stroke="#67e8f9" stroke-width="1" opacity="0.55"/>
  </g>

  <!-- CIRCULAR PEGS in a TRIANGULAR layout: 6 rows with 1, 2, 3, 4, 5, 6 pegs -->
  <!-- Each row is 50px below the previous; pegs r=4.5, chrome silver fill, dark stroke -->
  <g filter="url(#neonGlow)" fill="url(#pegChrome)" stroke="#5a6b80" stroke-width="0.8">
    <!-- Row 0 (1 peg at top, centered), y=80 -->
    <circle cx="240" cy="80"  r="4.5"/>
    <!-- Row 1 (2 pegs, slightly offset), y=130 -->
    <circle cx="210" cy="130" r="4.5"/>
    <circle cx="270" cy="130" r="4.5"/>
    <!-- Row 2 (3 pegs), y=180 -->
    <circle cx="180" cy="180" r="4.5"/>
    <circle cx="240" cy="180" r="4.5"/>
    <circle cx="300" cy="180" r="4.5"/>
    <!-- Row 3 (4 pegs), y=230 -->
    <circle cx="150" cy="230" r="4.5"/>
    <circle cx="210" cy="230" r="4.5"/>
    <circle cx="270" cy="230" r="4.5"/>
    <circle cx="330" cy="230" r="4.5"/>
    <!-- Row 4 (5 pegs), y=280 -->
    <circle cx="120" cy="280" r="4.5"/>
    <circle cx="180" cy="280" r="4.5"/>
    <circle cx="240" cy="280" r="4.5"/>
    <circle cx="300" cy="280" r="4.5"/>
    <circle cx="360" cy="280" r="4.5"/>
    <!-- Row 5 (6 pegs at the bottom of the triangle), y=330 -->
    <circle cx="90"  cy="330" r="4.5"/>
    <circle cx="150" cy="330" r="4.5"/>
    <circle cx="210" cy="330" r="4.5"/>
    <circle cx="270" cy="330" r="4.5"/>
    <circle cx="330" cy="330" r="4.5"/>
    <circle cx="390" cy="330" r="4.5"/>
  </g>

  <!-- Two falling balls (no drop chute at the top — balls appear mid-board). -->
  <g filter="url(#neonGlow)">
    <!-- Red ball, mid-triangle -->
    <circle cx="240" cy="190" r="10" fill="url(#redBall)" stroke="#5a0014" stroke-width="1.2"/>
    <ellipse cx="237" cy="186" rx="3" ry="1.5" fill="#ffd6dc" opacity="0.85"/>
    <!-- Cyan ball, lower in the field -->
    <circle cx="270" cy="280" r="10" fill="url(#cyanBall)" stroke="#0e4d60" stroke-width="1.2"/>
    <ellipse cx="267" cy="276" rx="3" ry="1.5" fill="#cffafe" opacity="0.85"/>
  </g>

  <!-- Slot dividers (6 dividers between 7 equal-width slots). -->
  <g stroke="#67e8f9" stroke-width="2" stroke-linecap="round" filter="url(#neonGlow)">
    <line x1="125" y1="370" x2="125" y2="440"/>
    <line x1="170" y1="370" x2="170" y2="440"/>
    <line x1="215" y1="370" x2="215" y2="440"/>
    <line x1="260" y1="370" x2="260" y2="440"/>
    <line x1="305" y1="370" x2="305" y2="440"/>
    <line x1="350" y1="370" x2="350" y2="440"/>
  </g>

  <!-- 7 payout slots: realistic Plinko pattern — HIGH at edges, 0.5x at center. -->
  <!-- Layout: 1000x, 100x, 5x, 0.5x, 5x, 100x, 1000x -->
  <rect x="85"  y="370" width="40" height="70" fill="url(#slotMax)"  filter="url(#bigGlow)"/>
  <rect x="130" y="370" width="40" height="70" fill="url(#slotHigh)" opacity="0.92"/>
  <rect x="175" y="370" width="40" height="70" fill="url(#slotMid)"  opacity="0.85"/>
  <rect x="220" y="370" width="40" height="70" fill="url(#slotLow)"  opacity="0.95" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="265" y="370" width="40" height="70" fill="url(#slotMid)"  opacity="0.85"/>
  <rect x="310" y="370" width="40" height="70" fill="url(#slotHigh)" opacity="0.92"/>
  <rect x="355" y="370" width="40" height="70" fill="url(#slotMax)"  filter="url(#bigGlow)"/>

  <!-- Multiplier labels — realistic Plinko payout table. -->
  <g font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff" paint-order="stroke fill" stroke="#000000" stroke-width="0.7">
    <text x="105" y="402" font-size="12">1000x</text>
    <text x="150" y="402" font-size="13">100x</text>
    <text x="195" y="402" font-size="14">5x</text>
    <text x="240" y="402" font-size="14" fill="#ffe2a8">0.5x</text>
    <text x="285" y="402" font-size="14">5x</text>
    <text x="330" y="402" font-size="13">100x</text>
    <text x="375" y="402" font-size="12">1000x</text>
  </g>

  <!-- Bottom triangle hints at each slot base (where balls settle). -->
  <g fill="#0a1733" filter="url(#neonGlow)">
    <polygon points="109,425 101,440 117,440"/>
    <polygon points="154,425 146,440 162,440"/>
    <polygon points="199,425 191,440 207,440"/>
    <polygon points="244,425 236,440 252,440"/>
    <polygon points="289,425 281,440 297,440"/>
    <polygon points="334,425 326,440 342,440"/>
    <polygon points="379,425 371,440 387,440"/>
  </g>
</svg>
