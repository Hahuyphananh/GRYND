<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1f3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bullseye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="400" height="300" fill="#0b1f3f"/>

  <!-- Outer halo. -->
  <rect width="400" height="300" fill="url(#halo)"/>

  <!-- Neon rings, varied colors. -->
  <g filter="url(#neonGlow)">
    <circle cx="200" cy="150" r="120" stroke="#22d3ee" stroke-width="2" fill="none" stroke-opacity="0.9"/>
    <circle cx="200" cy="150" r="100" stroke="#ff4fd8" stroke-width="1.6" fill="none" stroke-opacity="0.85"/>
    <circle cx="200" cy="150" r="82"  stroke="#fcd34d" stroke-width="1.8" fill="none" stroke-opacity="0.95"/>
    <circle cx="200" cy="150" r="66"  stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-opacity="0.85"/>
    <circle cx="200" cy="150" r="50"  stroke="#dc2626" stroke-width="1.6" fill="none" stroke-opacity="0.9"/>
    <circle cx="200" cy="150" r="36"  stroke="#fcd34d" stroke-width="1.4" fill="none" stroke-opacity="0.95"/>
  </g>

  <!-- Bullseye center with red→yellow gradient + glow. -->
  <g filter="url(#neonGlow)">
    <circle cx="200" cy="150" r="26" fill="url(#bullseye)" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="200" cy="150" r="6"  fill="#ffffff"/>
  </g>

  <!-- Crosshair ticks. -->
  <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
    <line x1="194" y1="150" x2="172" y2="150"/>
    <line x1="206" y1="150" x2="228" y2="150"/>
    <line x1="200" y1="144" x2="200" y2="122"/>
    <line x1="200" y1="156" x2="200" y2="178"/>
  </g>
</svg>
