<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06122a" />
      <stop offset="100%" stop-color="#120428" />
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="55%">
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bullseye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" />
  <circle cx="200" cy="150" r="140" fill="url(#ring)" />
  <g stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.4" fill="none">
    <circle cx="200" cy="150" r="110" />
    <circle cx="200" cy="150" r="85" />
    <circle cx="200" cy="150" r="60" />
  </g>
  <g stroke="#67e8f9" stroke-opacity="0.45">
    <line x1="200" y1="20" x2="200" y2="280" />
    <line x1="70" y1="150" x2="330" y2="150" />
  </g>
  <circle cx="200" cy="150" r="38" fill="url(#bullseye)" stroke="#fde68a" stroke-width="2" />
  <circle cx="200" cy="150" r="14" fill="#7f1d1d" />
  <circle cx="200" cy="150" r="4" fill="#fafafa" />
  <text x="200" y="270" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="28" fill="#f5ff3b" letter-spacing="6">
    PRECISION
  </text>
