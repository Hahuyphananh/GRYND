<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Roulette — neon roulette wheel with real roulette numbers (19, 4, 21, 2, 25, 0, 32, 15) on a hex-grid backdrop">
  <title>Roulette</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#261c5b"/>
      <stop offset="100%" stop-color="#030817"/>
    </radialGradient>

    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse">
      <polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.25"/>
    </pattern>

    <linearGradient id="rimCyber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>

    <linearGradient id="ringDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </linearGradient>

    <linearGradient id="pocketRed" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ff4060"/>
      <stop offset="50%" stop-color="#d11a3a"/>
      <stop offset="100%" stop-color="#5a0014"/>
    </linearGradient>
    <linearGradient id="pocketBlack" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#3a3a5a"/>
      <stop offset="50%" stop-color="#0e0e1f"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
    <linearGradient id="pocketGreen" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#0eaa58"/>
      <stop offset="50%" stop-color="#0a7c3a"/>
      <stop offset="100%" stop-color="#054022"/>
    </linearGradient>

    <radialGradient id="coneCyber" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfd8e3"/>
      <stop offset="65%" stop-color="#5a6b80"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </radialGradient>

    <radialGradient id="hubCyber" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>

    <radialGradient id="ballPearl" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dee5ed"/>
      <stop offset="100%" stop-color="#5a6b80"/>
    </radialGradient>
  </defs>

  <!-- Backdrop + hex grid + scanlines + sparkles. -->
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#hexGrid)"/>
  <ellipse cx="240" cy="280" rx="220" ry="170" fill="#5b21b6" opacity="0.18"/>

  <g opacity="0.08" fill="none" stroke="#67e8f9" stroke-width="0.5">
    <line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="100" x2="480" y2="100"/>
    <line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="220" x2="480" y2="220"/>
    <line x1="0" y1="280" x2="480" y2="280"/><line x1="0" y1="340" x2="480" y2="340"/>
    <line x1="0" y1="400" x2="480" y2="400"/><line x1="0" y1="460" x2="480" y2="460"/>
  </g>

  <g fill="#ffffff">
    <circle cx="40"  cy="80"  r="2"   opacity="0.9"/>
    <circle cx="440" cy="100" r="2.5" opacity="0.9"/>
    <circle cx="50"  cy="430" r="2"   opacity="0.9"/>
    <circle cx="430" cy="420" r="3"   opacity="0.9"/>
    <circle cx="240" cy="20"  r="1.5" opacity="0.7"/>
    <circle cx="55"  cy="240" r="2"   fill="#00e5ff" opacity="0.95"/>
    <circle cx="425" cy="240" r="2"   fill="#ff4fd8" opacity="0.95"/>
  </g>

  <!-- Top digital readout. -->
  <g transform="translate(240 56)">
    <rect x="-100" y="-22" width="200" height="40" rx="3" fill="#000816" stroke="#00e5ff" stroke-width="2" filter="url(#bigGlow)"/>
    <rect x="-94"  y="-16" width="188" height="28" rx="2" fill="none" stroke="#ff4fd8" stroke-width="0.6" opacity="0.7"/>
    <text x="0" y="6" font-family="'Courier New', Consolas, monospace" font-size="22" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="5">0x17  23 RED</text>
  </g>

  <!-- Corner circuit traces. -->
  <g stroke="#ff4fd8" stroke-width="1.4" fill="none" stroke-linecap="round" filter="url(#hotGlow)">
    <polyline points="40,120 70,140 90,140 100,155"/>
    <polyline points="40,200 60,200 80,210"/>
    <polyline points="440,120 410,140 390,140 380,155"/>
    <polyline points="440,200 420,200 400,210"/>
    <circle cx="40"  cy="120" r="2.5" fill="#ff4fd8"/>
    <circle cx="40"  cy="200" r="2"   fill="#00e5ff"/>
    <circle cx="440" cy="120" r="2.5" fill="#ff4fd8"/>
    <circle cx="440" cy="200" r="2"   fill="#00e5ff"/>
  </g>

  <!-- Outer cyberpunk rim. -->
  <g filter="url(#bigGlow)">
    <circle cx="240" cy="240" r="215" fill="none" stroke="url(#rimCyber)" stroke-width="9"/>
    <circle cx="240" cy="240" r="220" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.65"/>
  </g>
  <circle cx="240" cy="240" r="208" fill="none" stroke="#0e7490" stroke-width="2"/>

  <!-- Dark holographic ring. -->
  <circle cx="240" cy="240" r="205" fill="url(#ringDark)"/>
  <circle cx="240" cy="240" r="205" fill="url(#hexGrid)" opacity="0.5"/>

  <!-- 8 pie-segment pockets — pattern R, B, R, B, R, G, B, R (matches real-roulette 0/15/19/4/21/32/2/25 colors). -->
  <g filter="url(#neonGlow)" stroke="#0a0a14" stroke-width="1.5">
    <path d="M 240,240 L 240,40 A 200,200 0 0 1 381.42,98.58 Z" fill="url(#pocketRed)"/>
    <path d="M 240,240 L 381.42,98.58 A 200,200 0 0 1 440,240 Z" fill="url(#pocketBlack)"/>
    <path d="M 240,240 L 440,240 A 200,200 0 0 1 381.42,381.42 Z" fill="url(#pocketRed)"/>
    <path d="M 240,240 L 381.42,381.42 A 200,200 0 0 1 240,440 Z" fill="url(#pocketBlack)"/>
    <path d="M 240,240 L 240,440 A 200,200 0 0 1 98.58,381.42 Z" fill="url(#pocketRed)"/>
    <path d="M 240,240 L 98.58,381.42 A 200,200 0 0 1 40,240 Z" fill="url(#pocketGreen)"/>
    <path d="M 240,240 L 40,240 A 200,200 0 0 1 98.58,98.58 Z" fill="url(#pocketBlack)"/>
    <path d="M 240,240 L 98.58,98.58 A 200,200 0 0 1 240,40 Z" fill="url(#pocketRed)"/>
  </g>

  <!-- Real-roulette numbers centered at the radial midpoint of each segment. -->
  <!-- Segment midpoints at radius 135 from center: seg 0 mid-angle -67.5°, seg 1 -22.5°, ... seg 7 +247.5° (= -112.5°). -->
  <g font-family="'Courier New', Consolas, monospace" font-size="22" font-weight="900" text-anchor="middle" stroke="#000000" stroke-width="0.6" paint-order="stroke fill">
    <text x="289.7" y="119.9" fill="#ffffff">19</text>
    <text x="360.1" y="190.3" fill="#ffffff">4</text>
    <text x="360.1" y="289.7" fill="#ffffff">21</text>
    <text x="289.7" y="360.1" fill="#ffffff">2</text>
    <text x="190.3" y="360.1" fill="#ffffff">25</text>
    <text x="119.9" y="289.7" fill="#fcd34d">0</text>
    <text x="119.9" y="190.3" fill="#ffffff">32</text>
    <text x="190.3" y="119.9" fill="#ffffff">15</text>
  </g>

  <!-- Diamond separators. -->
  <g filter="url(#neonGlow)">
    <g transform="translate(240 240)">
      <g transform="rotate(-67.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(-22.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(22.5)"  ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(67.5)"  ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(112.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(157.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(202.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
      <g transform="rotate(247.5)" ><circle cx="0" cy="-200" r="3.6" fill="#67e8f9" stroke="#00e5ff" stroke-width="0.9"/></g>
    </g>
  </g>

  <!-- Inner holographic cone. -->
  <circle cx="240" cy="240" r="125" fill="url(#coneCyber)" stroke="#0e7490" stroke-width="2"/>
  <circle cx="240" cy="240" r="125" fill="url(#hexGrid)" opacity="0.35"/>

  <!-- Cone radial groove lines. -->
  <g stroke="#5a6b80" stroke-width="1" opacity="0.6">
    <g transform="translate(240 240)">
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(-67.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(-22.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(22.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(67.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(112.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(157.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(202.5)"/>
      <line x1="0" y1="-22" x2="0" y2="-122" transform="rotate(247.5)"/>
    </g>
  </g>

  <!-- Center hub layered. -->
  <g filter="url(#bigGlow)">
    <circle cx="240" cy="240" r="40" fill="none" stroke="#ff4fd8" stroke-width="6"/>
  </g>
  <circle cx="240" cy="240" r="40" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="32" fill="url(#hubCyber)" stroke="#0e7490" stroke-width="2"/>
  <circle cx="240" cy="240" r="14" fill="#1a1a3a" stroke="#67e8f9" stroke-width="0.6"/>
  <circle cx="240" cy="240" r="6" fill="#00e5ff" filter="url(#bigGlow)"/>
  <circle cx="234" cy="234" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Ball motion-trail glow. -->
  <g filter="url(#hotGlow)" transform="translate(240 240)">
    <g transform="rotate(-50)">
      <ellipse cx="0" cy="-244" rx="14" ry="5" fill="#ff4fd8" opacity="0.45"/>
    </g>
  </g>

  <!-- White pearl ball on outer track. -->
  <g filter="url(#neonGlow)" transform="translate(240 240)">
    <g transform="rotate(-50)">
      <circle cx="0" cy="-232" r="11" fill="url(#ballPearl)" stroke="#00e5ff" stroke-width="1.5"/>
      <ellipse cx="-3" cy="-235" rx="3" ry="1.5" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
