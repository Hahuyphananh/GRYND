<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Rock Paper Scissors — three hand signs around a best-of-7 round tracker">
  <title>Rock Paper Scissors</title>
  <defs>
    <linearGradient id="rps-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f3f" />
      <stop offset="55%" stop-color="#0a1530" />
      <stop offset="100%" stop-color="#000912" />
    </linearGradient>
    <radialGradient id="rps-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Badge ring gradients (dots-and-boxes host/guest palette). -->
    <linearGradient id="rps-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="rps-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="rps-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Paper fill — warm cream into golden fold. -->
    <radialGradient id="rps-paper" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fffbe8" />
      <stop offset="100%" stop-color="#f6d878" />
    </radialGradient>

    <filter id="rps-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="rps-strongGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect x="0" y="0" width="600" height="400" rx="22" fill="url(#rps-bg)" />

  <!-- Soft amber glow behind the widget. -->
  <rect x="40" y="20" width="520" height="360" rx="40" fill="url(#rps-glow)" />

  <!-- ─── Widget frame ──────────────────────────────────────────────── -->
  <g>
    <rect x="80" y="50" width="440" height="292" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1" />
    <rect x="80" y="50" width="440" height="292" rx="16" fill="#fbbf24" fill-opacity="0.05" />
    <!-- Top accent line -->
    <line x1="96" y1="66" x2="504" y2="66" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ─── PAPER badge (top center) ─────────────────────────────────── -->
  <g transform="translate(300 132)">
    <circle r="62" fill="url(#rps-amber)" filter="url(#rps-strongGlow)" opacity="0.95" />
    <circle r="56" fill="#0a1733" opacity="0.92" />
    <g stroke="#b07a04" stroke-width="2" stroke-linejoin="round">
      <rect x="-26" y="-32" width="52" height="64" rx="5" fill="url(#rps-paper)" />
      <path d="M 12,-32 L 26,-32 L 26,-20 Z" fill="#e6c468" />
      <g stroke="#a37830" stroke-width="1.8" stroke-linecap="round" opacity="0.6" fill="none">
        <line x1="-17" y1="-17" x2="15" y2="-17" />
        <line x1="-17" y1="-6" x2="15" y2="-6" />
        <line x1="-17" y1="5" x2="15" y2="5" />
        <line x1="-17" y1="16" x2="8" y2="16" />
        <line x1="-17" y1="27" x2="15" y2="27" />
      </g>
    </g>
  </g>

  <!-- ─── ROCK badge (bottom-left) — closed fist ───────────────────── -->
  <g transform="translate(196 252)">
    <circle r="60" fill="url(#rps-orange)" filter="url(#rps-strongGlow)" opacity="0.95" />
    <circle r="54" fill="#0a1733" opacity="0.92" />
    <!-- Fist glyph (adapted from Lucide hand-fist, ISC) scaled to badge size. -->
    <g transform="translate(-27 -27) scale(2.25)" fill="none" stroke="#fde68a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.035 17.012a3 3 0 0 0-3-3l-.311-.002a.72.72 0 0 1-.505-1.229l1.195-1.195A2 2 0 0 1 10.828 11H12a2 2 0 0 0 0-4H9.243a3 3 0 0 0-2.122.879l-2.707 2.707A4.83 4.83 0 0 0 3 14a8 8 0 0 0 8 8h2a8 8 0 0 0 8-8V7a2 2 0 1 0-4 0v2a2 2 0 1 0 4 0" />
      <path d="M13.888 9.662A2 2 0 0 0 17 8V5a2 2 0 1 0-4 0M9 5a2 2 0 1 0-4 0v5m4-3V4a2 2 0 1 1 4 0v3.268" />
    </g>
  </g>

  <!-- ─── SCISSORS badge (bottom-right) ────────────────────────────── -->
  <g transform="translate(404 252)">
    <circle r="60" fill="url(#rps-gold)" filter="url(#rps-strongGlow)" opacity="0.95" />
    <circle r="54" fill="#0a1733" opacity="0.92" />
    <g stroke="#fde68a" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="-16" cy="26" r="11" />
      <circle cx="16" cy="26" r="11" />
    </g>
    <g fill="url(#rps-paper)" stroke="#b07a04" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="-20,20 -9,31 28,-22" />
      <polygon points="20,20 9,31 -28,-22" />
    </g>
    <circle cx="0" cy="2" r="3.6" fill="#3a4757" stroke="#fde68a" stroke-width="1" />
  </g>

  <!-- ─── Best-of-7 round tracker (blue = you, red = opponent) ─────── -->
  <g transform="translate(300 356)">
    <!-- Faint glow ring behind each dot -->
    <g fill="#fbbf24" fill-opacity="0.18" filter="url(#rps-shadow)">
      <circle cx="-84" cy="0" r="10" />
      <circle cx="-56" cy="0" r="10" />
      <circle cx="-28" cy="0" r="10" />
      <circle cx="0" cy="0" r="10" />
      <circle cx="28" cy="0" r="10" />
      <circle cx="56" cy="0" r="10" />
      <circle cx="84" cy="0" r="10" />
    </g>
    <!-- Decided dots — 3 won (blue) + 2 lost (red) -->
    <circle cx="-84" cy="0" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="-56" cy="0" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="-28" cy="0" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
    <circle cx="28" cy="0" r="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
    <!-- Pending dots -->
    <circle cx="56" cy="0" r="6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="84" cy="0" r="6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
  </g>
</svg>
