<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Cyberpunk Slots — neon 3-reel slot machine with bright winning line">
  <title>Slots</title>
  <defs>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#261c5b"/><stop offset="100%" stop-color="#030817"/></radialGradient>
    <pattern id="hexGrid" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse"><polygon points="24,1 47,12 47,30 24,41 1,30 1,12" fill="none" stroke="#ff4fd8" stroke-width="0.4" opacity="0.22"/></pattern>
    <linearGradient id="reelBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000816"/><stop offset="100%" stop-color="#050a18"/></linearGradient>
  </defs>
  <rect width="480" height="480" fill="#0b1f3f"/>
  <!-- Slot machine frame -->
  <g filter="url(#neonGlow)">
    <rect x="60" y="120" width="320" height="280" rx="22" fill="#1a1a3a" stroke="#ff4fd8" stroke-width="3"/>
    <rect x="60" y="120" width="320" height="50" rx="22" fill="#ff4fd8" opacity="0.18"/>
  </g>
  <!-- 3 reels, each 80x180, at (95, 195), (180, 195), (265, 195) -->
  <g>
    <rect x="95"  y="195" width="80" height="180" rx="6" fill="url(#reelBg)" stroke="#67e8f9" stroke-width="2"/>
    <rect x="180" y="195" width="80" height="180" rx="6" fill="url(#reelBg)" stroke="#67e8f9" stroke-width="2"/>
    <rect x="265" y="195" width="80" height="180" rx="6" fill="url(#reelBg)" stroke="#67e8f9" stroke-width="2"/>
    <!-- Each reel shows 3 symbols stacked. -->
    <!-- Reel 1: cherry / lemon / BAR -->
    <g transform="translate(135 230)" filter="url(#neonGlow)">
      <circle r="14" fill="#dc2626"/><circle cx="-4" cy="-5" rx="3" ry="1.5" fill="#fca5a5"/>
      <path d="M -14,-12 L 14,-12" stroke="#0a7c3a" stroke-width="2.5"/>
      <ellipse cx="135" cy="290" rx="20" ry="9" fill="#fcd34d"/><path d="M 115,290 Q 135,278 155,290" fill="#fb923c"/>
      <text x="135" y="350" font-family="serif, Georgia" font-size="22" font-weight="900" fill="#fcd34d" text-anchor="middle">BAR</text>
    </g>
    <!-- Reel 2: 7-WIN / lemon / cherry -->
    <g filter="url(#bigGlow)">
      <text x="220" y="125" font-family="serif, Georgia" font-size="44" font-weight="900" fill="#dc2626" text-anchor="middle" opacity="0.5">7</text>
      <text x="220" y="295" font-family="serif, Georgia" font-size="64" font-weight="900" fill="#fcd34d" text-anchor="middle" filter="url(#bigGlow)">7</text>
      <ellipse cx="220" cy="350" rx="20" ry="9" fill="#fcd34d"/><path d="M 200,350 Q 220,338 240,350" fill="#fb923c"/>
      <text x="220" y="354" font-family="serif, Georgia" font-size="22" font-weight="900" fill="#dc2626" text-anchor="middle">7</text>
      <circle cx="220" cy="240" r="14" fill="#dc2626"/><circle cx="216" cy="235" rx="3" ry="1.5" fill="#fca5a5"/>
      <path d="M 206,228 L 234,228" stroke="#0a7c3a" stroke-width="2.5"/>
    </g>
    <!-- Reel 3: BAR / lemon / cherry -->
    <g transform="translate(305 230)" filter="url(#neonGlow)">
      <text x="305" y="240" font-family="serif, Georgia" font-size="22" font-weight="900" fill="#fcd34d" text-anchor="middle">BAR</text>
      <ellipse cx="305" cy="290" rx="20" ry="9" fill="#fcd34d"/><path d="M 285,290 Q 305,278 325,290" fill="#fb923c"/>
      <circle cx="305" cy="350" r="14" fill="#dc2626"/><circle cx="301" cy="345" rx="3" ry="1.5" fill="#fca5a5"/>
      <path d="M 291,338 L 319,338" stroke="#0a7c3a" stroke-width="2.5"/>
    </g>
  </g>
  <!-- Winning-line indicator across the middle (y=285). -->
  <g filter="url(#hotGlow)">
    <line x1="60" y1="285" x2="380" y2="285" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>
    <circle cx="60"  cy="285" r="3" fill="#fcd34d"/>
    <circle cx="380" cy="285" r="3" fill="#fcd34d"/>
  </g>
  <!-- Lever on right. -->
  <g filter="url(#bigGlow)" transform="translate(420 280)">
    <rect x="-8" y="-50" width="16" height="100" rx="6" fill="#5a6b80" stroke="#0e7490" stroke-width="2"/>
    <circle cx="0" cy="-60" r="14" fill="#dc2626" stroke="#0a1428" stroke-width="2"/>
    <circle cx="0" cy="-60" r="6" fill="#fcd34d"/>
  </g>
</svg>
