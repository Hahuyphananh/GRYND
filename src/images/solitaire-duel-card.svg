<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Solitaire Duel">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1030" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <radialGradient id="sd-halo" cx="50%" cy="40%" r="66%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30" />
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04060f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sd-p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="sd-p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <linearGradient id="sd-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbe4f0" />
    </linearGradient>
    <linearGradient id="sd-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23406b" />
      <stop offset="100%" stop-color="#122443" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sd-bg)" />
  <ellipse cx="200" cy="120" rx="190" ry="120" fill="url(#sd-halo)" />

  <!-- Stock + waste on the left, an opening foundation on the right. -->
  <g>
    <rect x="32" y="34" width="52" height="74" rx="7" fill="url(#sd-back)" stroke="#1c3559" stroke-width="2" opacity="0.7" />
    <rect x="26" y="30" width="52" height="74" rx="7" fill="url(#sd-back)" stroke="#1c3559" stroke-width="2" />
    <rect x="36" y="40" width="32" height="46" rx="4" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2" />

    <rect x="90" y="34" width="52" height="74" rx="7" fill="url(#sd-face)" />
    <text x="98" y="56" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#d81f3a">A</text>
    <text x="122" y="96" font-family="Georgia, serif" font-size="20" fill="#d81f3a">&#9829;</text>

    <rect x="322" y="34" width="52" height="74" rx="7" fill="url(#sd-face)" />
    <text x="330" y="56" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#141a24">A</text>
    <text x="352" y="96" font-family="Georgia, serif" font-size="20" fill="#141a24">&#9824;</text>
  </g>

  <!-- The tableau: seven fanned columns, the race's real board. -->
  <g>
    <!-- column 0 -->
    <rect x="26" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <!-- column 1 -->
    <rect x="80" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="80" y="150" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="86" y="168" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#141a24">K</text>
    <!-- column 2 -->
    <rect x="134" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="134" y="150" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="134" y="178" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="140" y="196" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#d81f3a">Q</text>
    <!-- column 3 -->
    <rect x="188" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="188" y="150" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="188" y="178" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="188" y="206" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="194" y="224" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#141a24">J</text>
    <!-- column 4 -->
    <rect x="242" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="242" y="150" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="242" y="178" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="248" y="196" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#d81f3a">10</text>
    <!-- column 5 -->
    <rect x="296" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="296" y="150" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="302" y="168" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#141a24">9</text>
    <!-- column 6 -->
    <rect x="350" y="122" width="44" height="30" rx="5" fill="url(#sd-back)" stroke="#1c3559" stroke-width="1.5" />
    <rect x="350" y="150" width="44" height="42" rx="5" fill="url(#sd-face)" />
    <text x="356" y="168" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#d81f3a">8</text>
  </g>

  <!-- The race: two progress bars, amber (you) against cyan (opponent). -->
  <g>
    <rect x="26" y="264" width="348" height="9" rx="4.5" fill="#0f1a30" />
    <rect x="26" y="264" width="228" height="9" rx="4.5" fill="url(#sd-p1)" />
    <rect x="26" y="279" width="348" height="9" rx="4.5" fill="#0f1a30" />
    <rect x="26" y="279" width="176" height="9" rx="4.5" fill="url(#sd-p2)" />
  </g>
</svg>
