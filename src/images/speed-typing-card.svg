<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1230" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <radialGradient id="st-halo" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32" />
      <stop offset="58%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04060f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="st-p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="st-p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#st-bg)" />
  <rect width="400" height="300" fill="url(#st-halo)" />

  <!-- Passage lines, with one cursor mid-word -->
  <g fill="#e2e8f0" opacity="0.9">
    <rect x="56" y="66" width="206" height="11" rx="5.5" />
    <rect x="270" y="66" width="74" height="11" rx="5.5" opacity="0.35" />
    <rect x="56" y="92" width="164" height="11" rx="5.5" />
    <rect x="228" y="92" width="116" height="11" rx="5.5" opacity="0.35" />
    <rect x="56" y="118" width="220" height="11" rx="5.5" opacity="0.35" />
  </g>
  <rect x="232" y="88" width="3" height="19" rx="1.5" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Two lanes: the race itself -->
  <g>
    <rect x="56" y="164" width="288" height="14" rx="7" fill="#131a33" />
    <rect x="56" y="164" width="188" height="14" rx="7" fill="url(#st-p1)" />
    <circle cx="244" cy="171" r="11" fill="#f59e0b" />

    <rect x="56" y="196" width="288" height="14" rx="7" fill="#131a33" />
    <rect x="56" y="196" width="140" height="14" rx="7" fill="url(#st-p2)" />
    <circle cx="196" cy="203" r="11" fill="#22d3ee" />
  </g>

  <!-- Keyboard strip -->
  <g fill="#273156">
    <rect x="56" y="238" width="30" height="22" rx="5" />
    <rect x="92" y="238" width="30" height="22" rx="5" />
    <rect x="128" y="238" width="30" height="22" rx="5" />
    <rect x="164" y="238" width="30" height="22" rx="5" />
    <rect x="200" y="238" width="30" height="22" rx="5" />
    <rect x="236" y="238" width="30" height="22" rx="5" />
    <rect x="272" y="238" width="30" height="22" rx="5" />
    <rect x="308" y="238" width="36" height="22" rx="5" fill="#33406d" />
  </g>
  <g fill="#8fa0cc" opacity="0.75">
    <rect x="66" y="247" width="10" height="4" rx="2" />
    <rect x="102" y="247" width="10" height="4" rx="2" />
    <rect x="138" y="247" width="10" height="4" rx="2" />
    <rect x="174" y="247" width="10" height="4" rx="2" />
    <rect x="210" y="247" width="10" height="4" rx="2" />
    <rect x="246" y="247" width="10" height="4" rx="2" />
    <rect x="282" y="247" width="10" height="4" rx="2" />
    <rect x="318" y="247" width="16" height="4" rx="2" />
  </g>
</svg>
