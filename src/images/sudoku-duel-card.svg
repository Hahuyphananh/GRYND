<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sudoku Duel">
  <defs>
    <linearGradient id="sd2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1030" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <radialGradient id="sd2-halo" cx="50%" cy="40%" r="66%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30" />
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04060f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sd2-p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="sd2-p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sd2-bg)" />
  <rect width="400" height="300" fill="url(#sd2-halo)" />

  <!-- The one shared 9x9 board both seats race to solve. -->
  <rect x="122" y="40" width="156" height="156" rx="8" fill="#0e1430" stroke="#2b3560" stroke-width="2" />

  <!-- Thin cell lines, then the thicker 3x3 box lines on top. -->
  <g stroke="#2b3560" stroke-width="1.5" stroke-opacity="0.8">
    <line x1="139.3" y1="42" x2="139.3" y2="194" />
    <line x1="156.7" y1="42" x2="156.7" y2="194" />
    <line x1="191" y1="42" x2="191" y2="194" />
    <line x1="208.3" y1="42" x2="208.3" y2="194" />
    <line x1="243.7" y1="42" x2="243.7" y2="194" />
    <line x1="261" y1="42" x2="261" y2="194" />
    <line x1="124" y1="57.3" x2="276" y2="57.3" />
    <line x1="124" y1="74.7" x2="276" y2="74.7" />
    <line x1="124" y1="109" x2="276" y2="109" />
    <line x1="124" y1="126.3" x2="276" y2="126.3" />
    <line x1="124" y1="161.7" x2="276" y2="161.7" />
    <line x1="124" y1="179" x2="276" y2="179" />
  </g>
  <g stroke="#3b4778" stroke-width="3.5" stroke-linecap="round">
    <line x1="174" y1="42" x2="174" y2="194" />
    <line x1="226" y1="42" x2="226" y2="194" />
    <line x1="124" y1="92" x2="276" y2="92" />
    <line x1="124" y1="144" x2="276" y2="144" />
  </g>

  <!-- Clues (white) and the player's verified entries (amber). -->
  <g
    font-family="ui-monospace, Menlo, Consolas, monospace"
    font-size="13"
    font-weight="700"
    text-anchor="middle"
    fill="#cfe3ff"
  >
    <text x="130.7" y="52.5">5</text>
    <text x="182.7" y="52.5">8</text>
    <text x="165.3" y="69.8">3</text>
    <text x="217.3" y="87.2">1</text>
    <text x="130.7" y="104.5">2</text>
    <text x="200" y="121.8">9</text>
    <text x="269.3" y="139.2">6</text>
    <text x="182.7" y="156.5">4</text>
    <text x="252" y="173.8">7</text>
    <text x="269.3" y="191.2">2</text>
  </g>
  <g
    font-family="ui-monospace, Menlo, Consolas, monospace"
    font-size="13"
    font-weight="700"
    text-anchor="middle"
    fill="#f59e0b"
  >
    <text x="130.7" y="69.8">7</text>
    <text x="165.3" y="87.2">4</text>
    <text x="200" y="156.5">8</text>
    <text x="217.3" y="173.8">3</text>
    <text x="130.7" y="191.2">1</text>
  </g>

  <!-- The race: two progress bars, amber (you) against cyan (opponent). -->
  <g>
    <rect x="26" y="264" width="348" height="9" rx="4.5" fill="#0f1a30" />
    <rect x="26" y="264" width="228" height="9" rx="4.5" fill="url(#sd2-p1)" />
    <rect x="26" y="279" width="348" height="9" rx="4.5" fill="#0f1a30" />
    <rect x="26" y="279" width="176" height="9" rx="4.5" fill="url(#sd2-p2)" />
  </g>
</svg>
