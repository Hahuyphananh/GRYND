<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Towers — 3D isometric tower with 8 stacked floors and multipliers labeled on the right side">
  <title>Towers</title>
  <defs>
    <!-- Filters for the neon glow. -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Wall (front face) gradients — dark to lit by climb progress. -->
    <linearGradient id="wallDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wallMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="wallLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#054022"/>
    </linearGradient>

    <!-- Top-platform parallelogram gradients. -->
    <linearGradient id="platDark" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="platMid" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="platLit" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Right-side face (depth) gradients. -->
    <linearGradient id="sideDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sideMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sideLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#054022"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Multiplier badge background. -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Plain marine blue backdrop. -->
  <rect width="480" height="480" fill="#0b1f3f"/>

  <!-- Subtle horizontal scanlines. -->
  <g opacity="0.05" fill="none" stroke="#67e8f9" stroke-width="0.5">
    <line x1="0" y1="60"  x2="480" y2="60"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="300" x2="480" y2="300"/>
    <line x1="0" y1="360" x2="480" y2="360"/>
    <line x1="0" y1="420" x2="480" y2="420"/>
  </g>

  <!-- Floor shadow under the tower base. -->
  <ellipse cx="232" cy="454" rx="135" ry="9" fill="#000000" opacity="0.55"/>

  <!--
       3D tower with 8 floors stacked bottom to top.
       Each slab has wall + right side face + top platform (parallelogram tilted by depth 25,16).
       A 4 px gap between slabs makes every floor's top platform visible — gives a true "stair
       step" 3D look instead of one solid stack with a single cap.

       Per-slab geometry (wall_y_top..wall_y_bottom, plat_back_y):
         Slab 1:  wall 410..440,  plat back 394   (DARK)
         Slab 2:  wall 376..406,  plat back 360   (DARK)
         Slab 3:  wall 342..372,  plat back 326   (MID)
         Slab 4:  wall 308..338,  plat back 292   (MID)
         Slab 5:  wall 274..304,  plat back 258   (MID)
         Slab 6:  wall 240..270,  plat back 224   (LIT)
         Slab 7:  wall 206..236,  plat back 190   (LIT)
         Slab 8:  wall 172..202,  plat back 156   (LIT, current target)

       Top-of-tower crown is omitted — no pink/magenta accent at the top.
       Floor-number ticks align with each slab's right edge.
  -->

  <g filter="url(#neonGlow)">
    <!-- Slab 1 (bottom, 1.3x) — DARK -->
    <polygon points="320,410 345,394 345,424 320,440" fill="url(#sideDark)" opacity="0.7"/>
    <rect x="120" y="410" width="200" height="30" rx="2" fill="url(#wallDark)" stroke="#0e7490" stroke-width="1.1"/>
    <polygon points="120,410 320,410 345,394 145,394" fill="url(#platDark)" stroke="#06b6d4" stroke-width="1.2"/>
    <line x1="125" y1="425" x2="315" y2="425" stroke="#0e7490" stroke-width="0.5" opacity="0.45"/>

    <!-- Slab 2 (1.7x) — DARK -->
    <polygon points="320,376 345,360 345,390 320,406" fill="url(#sideDark)" opacity="0.7"/>
    <rect x="120" y="376" width="200" height="30" rx="2" fill="url(#wallDark)" stroke="#0e7490" stroke-width="1.1"/>
    <polygon points="120,376 320,376 345,360 145,360" fill="url(#platDark)" stroke="#06b6d4" stroke-width="1.2"/>
    <line x1="125" y1="391" x2="315" y2="391" stroke="#0e7490" stroke-width="0.5" opacity="0.45"/>

    <!-- Slab 3 (2.4x) — MID -->
    <polygon points="320,342 345,326 345,356 320,372" fill="url(#sideMid)" opacity="0.75"/>
    <rect x="120" y="342" width="200" height="30" rx="2" fill="url(#wallMid)" stroke="#06b6d4" stroke-width="1.2"/>
    <polygon points="120,342 320,342 345,326 145,326" fill="url(#platMid)" stroke="#22d3ee" stroke-width="1.2"/>
    <line x1="125" y1="357" x2="315" y2="357" stroke="#06b6d4" stroke-width="0.5" opacity="0.55"/>

    <!-- Slab 4 (3.5x) — MID -->
    <polygon points="320,308 345,292 345,322 320,338" fill="url(#sideMid)" opacity="0.75"/>
    <rect x="120" y="308" width="200" height="30" rx="2" fill="url(#wallMid)" stroke="#06b6d4" stroke-width="1.2"/>
    <polygon points="120,308 320,308 345,292 145,292" fill="url(#platMid)" stroke="#22d3ee" stroke-width="1.2"/>
    <line x1="125" y1="323" x2="315" y2="323" stroke="#06b6d4" stroke-width="0.5" opacity="0.55"/>

    <!-- Slab 5 (5.2x) — MID -->
    <polygon points="320,274 345,258 345,288 320,304" fill="url(#sideMid)" opacity="0.75"/>
    <rect x="120" y="274" width="200" height="30" rx="2" fill="url(#wallMid)" stroke="#06b6d4" stroke-width="1.2"/>
    <polygon points="120,274 320,274 345,258 145,258" fill="url(#platMid)" stroke="#22d3ee" stroke-width="1.2"/>
    <line x1="125" y1="289" x2="315" y2="289" stroke="#06b6d4" stroke-width="0.5" opacity="0.55"/>

    <!-- Slab 6 (7.8x) — LIT -->
    <polygon points="320,240 345,224 345,254 320,270" fill="url(#sideLit)" opacity="0.8"/>
    <rect x="120" y="240" width="200" height="30" rx="2" fill="url(#wallLit)" stroke="#16a34a" stroke-width="1.4"/>
    <polygon points="120,240 320,240 345,224 145,224" fill="url(#platLit)" stroke="#86efac" stroke-width="1.3"/>
    <line x1="125" y1="255" x2="315" y2="255" stroke="#16a34a" stroke-width="0.6" opacity="0.7"/>

    <!-- Slab 7 (12.5x) — LIT -->
    <polygon points="320,206 345,190 345,220 320,236" fill="url(#sideLit)" opacity="0.8"/>
    <rect x="120" y="206" width="200" height="30" rx="2" fill="url(#wallLit)" stroke="#16a34a" stroke-width="1.4"/>
    <polygon points="120,206 320,206 345,190 145,190" fill="url(#platLit)" stroke="#86efac" stroke-width="1.3"/>
    <line x1="125" y1="221" x2="315" y2="221" stroke="#16a34a" stroke-width="0.6" opacity="0.7"/>

    <!-- Slab 8 (TOP, 21.0x) — LIT current target, extra glow on the top crown face -->
    <polygon points="320,172 345,156 345,186 320,202" fill="url(#sideLit)" opacity="0.85"/>
    <rect x="120" y="172" width="200" height="30" rx="2" fill="url(#wallLit)" stroke="#16a34a" stroke-width="1.7"/>
    <polygon points="120,172 320,172 345,156 145,156" fill="url(#platLit)" stroke="#22c55e" stroke-width="1.6" filter="url(#hotGlow)"/>
    <line x1="125" y1="187" x2="315" y2="187" stroke="#86efac" stroke-width="0.7" opacity="0.85"/>
  </g>

  <!-- Floor-number ticks beside each slab's right edge (small step markers). -->
  <g stroke="#67e8f9" stroke-width="1.1" opacity="0.7">
    <line x1="345" y1="425" x2="358" y2="425"/>
    <line x1="345" y1="391" x2="358" y2="391"/>
    <line x1="345" y1="357" x2="358" y2="357"/>
    <line x1="345" y1="323" x2="358" y2="323"/>
    <line x1="345" y1="289" x2="358" y2="289"/>
    <line x1="345" y1="255" x2="358" y2="255" stroke="#86efac"/>
    <line x1="345" y1="221" x2="358" y2="221" stroke="#86efac"/>
    <line x1="345" y1="187" x2="358" y2="187" stroke="#ffffff" stroke-width="1.4"/>
  </g>

  <!-- Multiplier badges (right side, vertically centered on each wall). -->
  <g filter="url(#neonGlow)">
    <rect x="370" y="413" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#0e7490" stroke-width="1"/>
    <rect x="370" y="379" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#0e7490" stroke-width="1"/>
    <rect x="370" y="345" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="370" y="311" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="370" y="277" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="370" y="243" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#16a34a" stroke-width="1.3"/>
    <rect x="370" y="209" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#16a34a" stroke-width="1.3"/>
    <rect x="370" y="175" width="80" height="24" rx="3" fill="url(#badgeBg)" stroke="#22c55e" stroke-width="1.6"/>
  </g>

  <g font-family="'Courier New', Consolas, monospace" font-weight="900" font-size="16" text-anchor="middle">
    <text x="410" y="430" fill="#67e8f9">1.3x</text>
    <text x="410" y="396" fill="#67e8f9">1.7x</text>
    <text x="410" y="362" fill="#67e8f9">2.4x</text>
    <text x="410" y="328" fill="#67e8f9">3.5x</text>
    <text x="410" y="294" fill="#67e8f9">5.2x</text>
    <text x="410" y="260" fill="#86efac">7.8x</text>
    <text x="410" y="226" fill="#86efac">12.5x</text>
    <text x="410" y="192" fill="#fcd34d" filter="url(#hotGlow)">21.0x</text>
  </g>

  <!-- Floating sparkle particles on the SIDES ONLY — no crown accent at top. -->
  <g fill="#67e8f9">
    <circle cx="40"  cy="220" r="2"   opacity="0.85"/>
    <circle cx="60"  cy="300" r="1.6" opacity="0.7"/>
    <circle cx="40"  cy="380" r="1.4" opacity="0.65"/>
    <circle cx="50"  cy="120" r="1.4" opacity="0.6"/>
  </g>
  <g fill="#86efac">
    <circle cx="450" cy="180" r="2"   opacity="0.85"/>
    <circle cx="460" cy="260" r="1.6" opacity="0.75"/>
    <circle cx="450" cy="340" r="1.4" opacity="0.65"/>
    <circle cx="448" cy="100" r="1.5" opacity="0.7"/>
  </g>
</svg>
