<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the grid use the full phone screen; the CSS
         keeps the tiles inside the safe area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <title>Memory Grid — remember the pattern, out-score the bot</title>
    <meta
      name="description"
      content="Study a lit pattern of tiles, then rebuild it from memory. Five rounds, the grid grows, and the bot recalls more than you think."
    />
    <!-- The build writes the icon set from public/ beside this file, and Vite
         rewrites root-relative paths for a relative `base`, so the package works
         under any CDN subpath. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Everything this game needs is bundled next to this file: no fonts, no
         analytics, no CDN, no network calls of any kind. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
