<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the board use the full phone screen; the CSS
         keeps the cards inside the safe area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <title>Solitaire Duel — race the bot on the same deal</title>
    <meta
      name="description"
      content="You and the bot get the same Klondike deal. Clear all 52 cards to the foundations first to win. Every deal is proven solvable."
    />
    <!-- The icon set is copied from public/ into this folder by the build, and
         is referenced with root-relative paths that Vite rewrites to `./` for
         a relative `base` — so the package works under any CDN subpath. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Everything this game needs is bundled next to this file: no fonts, no
         analytics, no CDN, no network calls of any kind. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
